name: main

# What runs once a change has landed, and none of it is a substitute for the
# pull-request gate.
#
# The `integration` job runs the code that needs a real backing service against
# one — `store-postgres` against PostgreSQL, `blob-garage` against S3 (Garage),
# `link-nats` and the `pos_cloud` ingest cursor against NATS JetStream (all P7). The
# service image is pinned by digest, not tag: a tag is mutable, and a silently
# changed database version is a long afternoon.
#
# The S3 third runs against **Garage**, the server `deploy/compose.yml` actually
# deploys, not against a stand-in. It used to be MinIO, until `minio/minio`
# disappeared from Docker Hub and took this job down with it; the replacement was
# chosen for what it proves rather than for being the closest swap — the risky part
# of `blob-garage` is its hand-rolled SigV4 ([ADR-0031](../../docs/adr/0031-cloud-adapter-transports.md)),
# and proving that against the deployed server is worth more than proving it
# against a second implementation nobody runs.
#
# **The PostgreSQL third of this now also runs pre-merge**, in `pr.yml`'s
# `postgres` job. This header used to say the whole job was "too slow or too
# stateful" for the ten-minute gate; the clock disagreed for that third — 92
# cases in about twenty seconds — and two broken statements reached `main`
# because nothing checked SQL before it landed. It stays here too: this job is
# what proves the three adapters together on one runner, and a duplicate twenty
# seconds after merge is not a cost worth reasoning about. Garage and NATS are a
# different matter and stay post-merge only: neither fits a `services:` block —
# NATS needs a command it cannot pass, Garage needs its config mounted first —
# and Garage additionally needs a layout assigned and a key minted before it
# will answer.

on:
  push:
    branches: [main, "release/**"]
  # These jobs are the only place the three adapters meet real backing services, and
  # nothing before a merge runs them — so a change to this file can only be proven
  # after it has landed. This lets a branch ask for one run first.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------------------
  # Against real PostgreSQL, S3 (Garage) and NATS JetStream. The domain never needs
  # any of them; the adapters do, and a contract test that runs only against a fake
  # proves nothing about the real thing.
  # ---------------------------------------------------------------------------
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # Pinned by digest (postgres:16 as of this commit), not tag — see the file header.
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: poscloud
        ports:
          - 5432:5432
        # Do not start the test step until the database answers, or the first
        # connection races the container's boot and fails intermittently.
        options: >-
          --health-cmd "pg_isready -U pos -d poscloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # libpq key=value form. `pos` is the image's superuser, so it owns `events` and
      # bypasses the row-level policy — which is what the trusted ingest adapter does;
      # the RLS cases drop to the `app_tenant` role to prove the policy still bites.
      DATABASE_URL: "host=localhost port=5432 user=pos password=pos dbname=poscloud"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - name: store-postgres against a real PostgreSQL
        # Single-threaded: every case shares the one database and truncates between
        # cases (see the crate's tests/integration.rs).
        run: cargo test -p store-postgres --features integration --locked -- --test-threads=1
      - name: start Garage
        # The S3 server the fork actually deploys (`deploy/compose.yml`), at the same version, so
        # the hand-rolled SigV4 is proven against the thing production runs rather than against a
        # stand-in. Pinned by digest (dxflrs/garage:v1.0.1 as of this commit), not tag — see the
        # file header. A step rather than a `services:` entry because the server needs its config
        # mounted before it starts, which a service block cannot do.
        #
        # The sequence below is `deploy/bootstrap.sh`'s, deliberately: config, wait for the RPC,
        # assign a single-node layout, mint a key. Keeping CI on the operator's commands means a
        # provisioning step that breaks breaks here first.
        run: |
          set -euo pipefail
          mkdir -p /tmp/garage
          # Generated, not written down: a literal here would be a 64-hex string next to the word
          # `rpc_secret`, which is what a secret is, and the `secrets` gate is right to refuse it
          # however throwaway the value. `bootstrap.sh` generates its own the same way.
          rpc_secret="$(openssl rand -hex 32)"
          cat > /tmp/garage/garage.toml <<EOF
          metadata_dir = "/var/lib/garage/meta"
          data_dir = "/var/lib/garage/data"
          db_engine = "lmdb"
          replication_factor = 1
          rpc_bind_addr = "[::]:3901"
          rpc_secret = "${rpc_secret}"

          [s3_api]
          s3_region = "garage"
          api_bind_addr = "[::]:3900"
          root_domain = ".s3.garage.local"
          EOF
          docker run -d --name garage -p 3900:3900 \
            -v /tmp/garage/garage.toml:/etc/garage.toml:ro \
            dxflrs/garage@sha256:a5706cf1f3d7b349ac5133ec59ad8181b709270b75e5f2fa7b3e1a5c07d67137

          garage() { docker exec garage /garage "$@"; }

          # Garage answers its RPC a little after the container starts; bootstrap.sh waits the same
          # way. Without this the first `layout assign` races the boot and fails intermittently.
          ready=0
          for _ in $(seq 1 30); do
            if garage status >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "Garage did not answer its RPC" >&2
            docker logs garage || true
            exit 1
          fi

          # `garage status` prints the node id in the first column of the first node row.
          node_id="$(garage status | awk '/^[0-9a-f]{16}/ { print $1; exit }')"
          if [ -z "$node_id" ]; then
            echo "could not read the Garage node id from:" >&2
            garage status >&2 || true
            exit 1
          fi
          garage layout assign -z ci -c 1G "$node_id"
          garage layout apply --version 1

          # `key create` prints the id and secret once. Unlike production, this key is allowed to
          # create buckets: the contract suite hands every case a freshly-created bucket of its own
          # (`blob-garage` tests/integration.rs), which is what `ensure_bucket` is for and its only
          # caller in the tree. The deployed key never gets this — bootstrap.sh pre-creates one
          # bucket and grants read/write on it, and nothing in `pos_cloud` calls `ensure_bucket`.
          key_out="$(garage key create ci)"
          key_id="$(printf '%s\n' "$key_out" | awk -F': *' '/Key ID/ { print $2; exit }')"
          key_secret="$(printf '%s\n' "$key_out" | awk -F': *' '/Secret key/ { print $2; exit }')"
          if [ -z "$key_id" ] || [ -z "$key_secret" ]; then
            echo "could not mint a Garage key" >&2
            exit 1
          fi
          garage key allow --create-bucket "$key_id"

          echo "::add-mask::$key_secret"
          {
            echo "S3_ACCESS_KEY=$key_id"
            echo "S3_SECRET_KEY=$key_secret"
          } >> "$GITHUB_ENV"
      - name: blob-garage against a real S3
        env:
          S3_ENDPOINT: http://localhost:3900
          # Garage's own default region name. It is a signing input, not a geography, and has to
          # match `s3_region` in the config above or every request fails the signature check.
          S3_REGION: garage
        run: cargo test -p blob-garage --features integration --locked
      - name: start NATS with JetStream
        # Pinned by digest (nats:2.10 as of this commit), not tag — see the file header. A step
        # rather than a service because JetStream needs the `-js` flag, which a service block cannot
        # pass; `-m 8222` exposes the monitoring endpoint the readiness check polls.
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 \
            nats@sha256:5498ba57b9471840be3d15b033a4eec554d1c02fa6c2cc0ca2d888637f6c6e2f \
            -js -m 8222
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8222/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "NATS did not become ready" >&2
          docker logs nats || true
          exit 1
      - name: start a second NATS that enforces a token
        # The broker above runs with no authorization, which is how a real defect survived: a token
        # written into the URL was silently dropped, and every deployment's generated `nats.conf`
        # carries an `authorization { token: … }` block. A tokenless server can never catch that, so
        # the auth cases get a broker that actually refuses. Same pinned digest, `--auth` set, on a
        # second port so both are up at once.
        run: |
          docker run -d --name nats-auth -p 4223:4222 -p 8223:8222 \
            nats@sha256:5498ba57b9471840be3d15b033a4eec554d1c02fa6c2cc0ca2d888637f6c6e2f \
            -js -m 8222 --auth ci-nats-token
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8223/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "the token-enforcing NATS did not become ready" >&2
          docker logs nats-auth || true
          exit 1
      - name: link-nats against a real NATS
        env:
          NATS_URL: "127.0.0.1:4222"
          # The credentials are in the URL on purpose: that is the form every document in this tree
          # tells an operator to use, so it is the form the test must prove works.
          NATS_AUTH_URL: "nats://:ci-nats-token@127.0.0.1:4223"
        run: cargo test -p link-nats --features integration --locked
      - name: pos_cloud ingest cursor against a real NATS
        # The end-to-end proof that the durable cursor drives Cloud::ingest idempotently against real
        # JetStream (over the fake store, so this step needs only NATS). See tests/cursor.rs.
        env:
          NATS_URL: "127.0.0.1:4222"
        run: cargo test -p pos-cloud --features integration --locked --test cursor

  # ---------------------------------------------------------------------------
  # Contract tests: every implementation of every port runs the same suite. This
  # is what makes "swappable" a verified fact rather than a claim, and it is one of
  # the three nets that catch a syntactically-correct, semantically-wrong change.
  # ---------------------------------------------------------------------------
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      # Every adapter's `tests/contract.rs` runs the shared suite for its port
      # (`pos-contract-tests`), so `--test contract` runs them all and skips the
      # crates that have no such target. The suites here need no service — the
      # network adapters' heavier suites gate behind `--features integration` and
      # run in the integration job — so this is a fast, deterministic signal that
      # "swappable" holds for every fake and file-backed adapter.
      - name: port contract suites
        run: cargo test --workspace --locked --test contract
