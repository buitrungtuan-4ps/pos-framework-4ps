name: deploy

# Manual deploy of one country cell to its VPS (ADR-0044). CI builds the two images for the
# box's own CPU architecture (detected over SSH; amd64 and arm64 — Ampere/Graviton — both work)
# by cross-compiling on the runner rather than emulating the box (see "Build the images"),
# ships them over the existing SSH channel (no registry — GitHub holds no application secret),
# and runs bootstrap.sh on the box. A rollback is re-running with an older commit's image tag:
# the app container is stateless, all durable state lives in the postgres/garage/nats volumes.
#
# Required GitHub secrets — the only values that ever cross the repo boundary, and none is an
# application secret (the box mints those itself, ADR-0044):
#   VPS_HOST          host or IP to SSH to
#   VPS_USER          SSH user (e.g. a sudo-less deploy user, or root)
#   VPS_SSH_KEY       that user's private key (PEM)
#   VPS_KNOWN_HOSTS   the box's SSH host key(s), so the connection is not trust-on-first-use
#                     (for a non-default port, generate with `ssh-keyscan -p <port>` — the
#                     entries are then keyed as `[host]:port`, which is what SSH looks up)
#   VPS_PORT          SSH port (optional; defaults to 22 when unset or empty)
#   DOMAIN            the cell's hostname (or <vps-ip>.sslip.io with no purchased domain)
#   TLS_MODE          the TLS posture (ADR-0090), one of acme-http01 | acme-dns01 | byo-cert |
#                     external. Optional: unset means acme-http01, which is what an sslip.io or
#                     any A-record DOMAIN wants. It is never inferred from DOMAIN.
#   ACME_EMAIL        contact address for the TLS certificate (the two acme-* modes require it)
#   CF_DNS_API_TOKEN  Cloudflare Zone:DNS:Edit token — required by TLS_MODE=acme-dns01 and unused
#                     by every other mode. bootstrap.sh refuses that mode without it rather than
#                     falling back to a challenge that cannot answer for a DNS-only record.
#
# reset_admin=true is the break-glass (ADR-0045): after bring-up it clears the super-admin and
# every session on the box, so the operator can re-enrol at /admin/setup. It — and every
# deploy — runs through the `production` Environment, whose required reviewer is the second
# human the break-glass needs; configure that protection rule on the fork.

on:
  workflow_dispatch:
    inputs:
      reset_admin:
        description: "Break-glass: wipe the super-admin and all sessions, then re-enrol via /admin/setup"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # The images are cross-compiled on the runner's own CPU (no QEMU), so even an arm64 box built
    # on an amd64 runner compiles at native speed. Allow headroom over the ~10-15 minute build for
    # a cold toolchain and the image ship, not for emulation.
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open the SSH channel
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Detect the box architecture
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          port="${VPS_PORT:-22}"
          ssh_opts="-i $HOME/.ssh/id_deploy -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          # The images must match the VPS CPU or the containers die with "exec format error".
          # Ask the box directly rather than assuming amd64 — Oracle Ampere, AWS Graviton and
          # most free-tier ARM instances are arm64. Map uname -m to a docker platform.
          arch="$(ssh -p "$port" $ssh_opts "${VPS_USER}@${VPS_HOST}" 'uname -m')"
          case "$arch" in
            x86_64|amd64)  platform="linux/amd64" ;;
            aarch64|arm64) platform="linux/arm64" ;;
            *) echo "unsupported box architecture: '$arch'" >&2; exit 1 ;;
          esac
          echo "box architecture: $arch -> $platform"
          echo "TARGET_PLATFORM=$platform" >> "$GITHUB_ENV"

      - name: Build the images
        env:
          TLS_MODE: ${{ secrets.TLS_MODE }}
        run: |
          TAG="${GITHUB_SHA}"
          # Build for the box's architecture (TARGET_PLATFORM), not the runner's — but WITHOUT
          # QEMU. Both Dockerfiles pin their builder stage to $BUILDPLATFORM (the runner's amd64)
          # and emit a $TARGET_PLATFORM binary (Rust via the aarch64 GNU toolchain, caddy via
          # GOARCH), and their runtime stages run no commands, so nothing is ever emulated and an
          # arm64 image builds at native speed. buildx (docker-container driver) is still what lets
          # a single --platform build --load a foreign-arch image into the daemon so `docker save`
          # can ship it.
          docker buildx create --use --name posdeploy >/dev/null 2>&1 || docker buildx use posdeploy
          docker buildx build --platform "$TARGET_PLATFORM" --load \
            -f deploy/Dockerfile -t "pos-cloud:${TAG}" .
          # The custom Caddy image exists ONLY to embed the Cloudflare DNS-01 plugin, so it is
          # built ONLY for TLS_MODE=acme-dns01. Every other posture — HTTP-01, a brought
          # certificate, TLS terminated upstream — needs no plugin and ships the stock official
          # image (multi-arch) for the box's platform, skipping the xcaddy build entirely. This
          # keys off TLS_MODE rather than DOMAIN's suffix (ADR-0090): the old rule built the plugin
          # image for any non-sslip.io hostname, including deployments that never use DNS-01.
          # Both paths ship their caddy image inside the same tarball, so the box loads it and
          # Compose never builds.
          case "${TLS_MODE:-acme-http01}" in
            acme-dns01)
              CADDY_REF="pos-caddy:${TAG}"
              docker buildx build --platform "$TARGET_PLATFORM" --load \
                -f deploy/caddy.Dockerfile -t "$CADDY_REF" deploy
              ;;
            acme-http01 | byo-cert | external)
              CADDY_REF="caddy:2.8.4"
              docker pull --platform "$TARGET_PLATFORM" "$CADDY_REF"
              ;;
            *)
              echo "TLS_MODE='${TLS_MODE}' is not one of: acme-http01 acme-dns01 byo-cert external" >&2
              exit 1
              ;;
          esac
          docker save "pos-cloud:${TAG}" "$CADDY_REF" | gzip > /tmp/images.tgz
          echo "CADDY_IMAGE=$CADDY_REF" >> "$GITHUB_ENV"

      - name: Ship the images and the deploy files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          port="${VPS_PORT:-22}"
          ssh_opts="-i $HOME/.ssh/id_deploy -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          target="${VPS_USER}@${VPS_HOST}"
          # Ship the deploy tree, but never the local secrets/ — the box holds its own.
          # Never the local secrets/, and never a local .env: the box generates its own from
          # TLS_MODE (ADR-0090), and shipping a developer's would silently override the posture.
          tar -C deploy --exclude=secrets --exclude=.env -czf /tmp/deploy.tgz .
          scp -P "$port" $ssh_opts /tmp/deploy.tgz /tmp/images.tgz "${target}:/tmp/"
          ssh -p "$port" $ssh_opts "$target" '
            set -e
            mkdir -p ~/pos-cloud/deploy
            tar -C ~/pos-cloud/deploy -xzf /tmp/deploy.tgz
            gunzip -c /tmp/images.tgz | docker load
          '

      - name: Pre-update database snapshot
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          port="${VPS_PORT:-22}"
          ssh_opts="-i $HOME/.ssh/id_deploy -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          target="${VPS_USER}@${VPS_HOST}"
          # Snapshot the existing database before the new image comes up, so a bad release rolls
          # back to a known-good copy (ADR-0046). The first deploy has no database yet — skip.
          ssh -p "$port" $ssh_opts "$target" '
            cd ~/pos-cloud/deploy
            chmod +x backup.sh
            if [ -n "$(docker compose ps -q postgres 2>/dev/null)" ]; then
              ./backup.sh --label pre-update
            else
              echo "no running postgres yet; skipping the pre-update snapshot (first deploy)"
            fi
          '

      - name: Bootstrap and bring up
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DOMAIN: ${{ secrets.DOMAIN }}
          TLS_MODE: ${{ secrets.TLS_MODE }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          CF_DNS_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          port="${VPS_PORT:-22}"
          ssh_opts="-i $HOME/.ssh/id_deploy -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          target="${VPS_USER}@${VPS_HOST}"
          tag="${GITHUB_SHA}"
          # Uses the images just loaded (POS_BOOTSTRAP_NO_BUILD=1 so the box never rebuilds from
          # source). CADDY_IMAGE was chosen per-TLS_MODE in "Build the images" (the plugin image
          # only for acme-dns01, stock caddy otherwise) and carried via $GITHUB_ENV.
          # bootstrap.sh keeps every generated secret, so a redeploy does not rotate them; TLS_MODE
          # and DOMAIN are supplied configuration, so changing either here does take effect.
          ssh -p "$port" $ssh_opts "$target" \
            "cd ~/pos-cloud/deploy && chmod +x bootstrap.sh reset-admin.sh tls-export.sh && \
             DOMAIN='${DOMAIN}' TLS_MODE='${TLS_MODE}' ACME_EMAIL='${ACME_EMAIL}' \
             CF_DNS_API_TOKEN='${CF_DNS_API_TOKEN}' \
             POS_CLOUD_IMAGE='pos-cloud:${tag}' CADDY_IMAGE='${CADDY_IMAGE}' POS_BOOTSTRAP_NO_BUILD=1 \
             ./bootstrap.sh"

      - name: Break-glass admin reset
        if: ${{ inputs.reset_admin }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          port="${VPS_PORT:-22}"
          ssh_opts="-i $HOME/.ssh/id_deploy -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          target="${VPS_USER}@${VPS_HOST}"
          echo "reset_admin=true: clearing the super-admin and all sessions on the box"
          ssh -p "$port" $ssh_opts "$target" 'cd ~/pos-cloud/deploy && ./reset-admin.sh'
