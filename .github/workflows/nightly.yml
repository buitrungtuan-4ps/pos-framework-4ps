name: nightly

# Two things belong on a schedule rather than on a commit.
#
# `cargo audit` is one of them: the advisory database moves independently of this
# repository, so a dependency that was clean at merge time can become vulnerable
# without anything here changing. A per-commit check would never notice.
#
# The rest — the simulator soak, the restore drill, the edge's performance
# budgets and the till's tap-to-paint budgets — arrive with the crates they
# exercise (P12, P8, finding F2, ADR-0173). The restore
# drill matters more than it looks: a backup that has never been restored is not a
# backup, and it is the drill, not the backup job, that proves the five-minute
# machine replacement works.

on:
  schedule:
    # 19:00 UTC = 02:00 in Vietnam, comfortably after the 04:00 business-date
    # cutoff has closed the previous trading day everywhere the fleet runs.
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - name: install cargo-deny
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[cargo-deny\]/,/^\[just\]/p' tools/tool-versions.toml \
                     | sed -n 's/^version *= *"\(.*\)"/\1/p')"
          cargo install cargo-deny --locked --version "$version"
      - name: advisories against a freshly fetched database
        run: cargo deny --all-features check advisories

      # deny.toml keeps `skip` and `skip-tree` empty today. That will not survive
      # tokio, sqlx and the windows-* family arriving, so report the size of those
      # lists every night: the point is that they ratchet down rather than grow
      # quietly.
      - name: report duplicate-version exemptions
        run: |
          set -euo pipefail
          count="$(grep -cE '^\s*\{\s*(crate|name)\s*=' <<<"$(sed -n '/^skip\(-tree\)\? *= *\[/,/^\]/p' deny.toml)" || true)"
          echo "duplicate-version exemptions currently allowed: ${count:-0}"

  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      # The `pos-simulator` scenario tests assert the published capacity-and-reliability
      # envelope (222 ev/s sustained ingest with 500-700 bursts; ~200 stores draining a
      # day's backlog; 1,000 stores each applying a config version within a second): a
      # regression that breaks a threshold fails this job. The report run then prints the
      # same numbers to the log for a human to eyeball. This is the model-based soak; the
      # real-hardware soak stays an ops gate (roadmap-v3 A·P5).
      - name: fleet simulator scenarios (capacity envelope)
        run: cargo test -p pos-simulator --locked
      - name: fleet simulator report
        run: cargo run -q -p pos-simulator

  # The edge's hot-path budgets (`crates/pos-edge/tests/perf_budget.rs`, `just bench`): the live
  # orders read and adding a line, quiet and under contention, at 30,000 settled orders of history.
  # They are `#[ignore]`d in every commit's gate because a timing assertion in a debug build on a
  # shared runner measures the runner; a release build once a night measures the code, and a store
  # that has started getting slower with age again (finding F2) fails this job.
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - name: the edge's performance budgets, over the in-memory store
        run: cargo test -p pos-edge --release --locked --test perf_budget -- --ignored --nocapture
      - name: the same budgets over the real SQLite adapter
        env:
          POS_BENCH_STORE: sqlite
        run: cargo test -p pos-edge --release --locked --test perf_budget -- --ignored --nocapture

  # The till's tap-to-paint budgets (ADR-0173 decision 6; `ui/perf/tap-to-paint.spec.mjs`, `pnpm
  # perf`): from a tap to the first frame that answers it, 95th percentile, 50 ms for what the till
  # answers alone or paints before the edge answers, 150 ms for an act that waits for the edge and
  # 300 ms from a reload to a drawn order screen. Never on a pull request (ADR-0109): a timing in a
  # debug build on a shared runner measures the runner, so this is a release edge and a production
  # till, once a night. The figures and each budget's headroom are kept for a fortnight either way.
  tap-to-paint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: tap-to-paint
      - uses: ./.github/actions/node-setup
      - name: install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: build the operator UI for production
        working-directory: ui
        run: pnpm build
      # `minimal-edge` embeds ui/dist at compile time, so the UI is built first.
      - name: build the example store, release
        run: cargo build -p minimal-edge --release --locked
      # The runner's own Playwright Chromium, with the libraries a headless one needs.
      - name: install the browser
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium
      - name: tap-to-paint against its budgets
        working-directory: ui
        env:
          POS_EDGE_BIN: ${{ github.workspace }}/target/release/minimal-edge
          POS_PERF_ENFORCE: "1"
          POS_PERF_OUT: test-results/tap-to-paint.json
        run: pnpm perf
      - name: keep the figures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tap-to-paint
          path: ui/test-results/tap-to-paint.json
          retention-days: 14
          if-no-files-found: warn

  # Exercises the cloud-database restore path for real (P8, ADR-0046): seed a service Postgres,
  # then deploy/restore-drill.sh dumps it, restores into a throwaway database, and reconciles every
  # table's row count against the source. A silently-unrestorable backup fails this job. The store
  # half of the drill (a random store backup) is edge WAL shipping — P9, spike A4 — and joins here
  # when it lands; per-store recovery alone does not prove the chain's data is restorable.
  restore-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Pinned by digest (postgres:16 as of this commit), matching the integration job in main.yml.
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: poscloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d poscloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: pos
      PGPASSWORD: pos
      PGDATABASE: poscloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install the postgres client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: seed a synthetic dataset
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE TABLE drill_marker (id serial PRIMARY KEY, val text NOT NULL)"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO drill_marker (val) SELECT 'row-' || g FROM generate_series(1, 137) g"
      - name: restore drill — dump, restore to a scratch database, reconcile counts
        run: |
          chmod +x deploy/restore-drill.sh
          deploy/restore-drill.sh
