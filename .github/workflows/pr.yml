name: pr

# The gate every pull request passes. Target: under ten minutes, enforced by
# `timeout-minutes` on each job rather than left as an aspiration — a target
# nothing measures is a wish.
#
# Jobs run in parallel, and each is ordered internally so the cheapest failure
# surfaces first. A contributor with a naming mistake should not wait for a full
# clippy pass to hear about it.

on:
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------------------
  # Repository rules. No heavy compilation, so this is the fastest signal.
  # ---------------------------------------------------------------------------
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changed-file gates need the base branch.
          fetch-depth: 0
      - uses: ./.github/actions/rust-setup

      - name: dependency rule
        run: cargo run -q -p xtask -- deps-rule
      - name: per-crate clippy.toml restates the baseline
        run: cargo run -q -p xtask -- lint-config
      - name: every action pinned to a commit SHA
        run: cargo run -q -p xtask -- actions-pinned
      - name: internal documentation links resolve
        run: cargo run -q -p xtask -- links
      - name: every country module is named, wired in, and selectable
        run: cargo run -q -p xtask -- countries
      - name: files mirrored across the front-end build roots stay identical
        run: cargo run -q -p xtask -- mirrored-files
      - name: no vendor brand name in pos-core / pos-proto production code
        run: cargo run -q -p xtask -- vendor-neutral-core
      - name: every accepted TLS_MODE has its Caddyfile and imports the shared block
        run: cargo run -q -p xtask -- tls-modes
      - name: nothing removed from a committed snapshot
        run: cargo run -q -p xtask -- snapshot --base origin/${{ github.base_ref }}
      - name: migrations are additive-only
        run: cargo run -q -p xtask -- migrations --base origin/${{ github.base_ref }}

      # The dependency rule is the check that turns the architecture into law, so
      # prove it still fires rather than trusting that it would. Runs against a
      # throwaway copy of the tree.
      - name: the dependency rule rejects tokio in the domain
        run: bash xtask/tests/deps_rule_e2e.sh

  # ---------------------------------------------------------------------------
  # Formatting and lints, including the backbone pass that cannot be escaped.
  # ---------------------------------------------------------------------------
  lints:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup

      - run: cargo fmt --all -- --check

      - name: clippy (workspace)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Not redundant with the pass above. A source-level `#![allow]` overrides a
      # `deny` inherited from [workspace.lints], so that table is not a floor.
      # `--forbid` cannot be overridden — `allow` against `forbid` is E0453 — and
      # this pass is the only thing making the backbone's no-panic and no-float
      # rules unescapable rather than conventional.
      - name: clippy (backbone, unescapable)
        run: |
          for crate in pos-core pos-ports pos-proto; do
            cargo clippy -p "$crate" --all-targets -- \
              -F clippy::unwrap_used -F clippy::expect_used -F clippy::panic \
              -F clippy::todo -F clippy::unimplemented \
              -F clippy::print_stdout -F clippy::print_stderr \
              -F clippy::float_arithmetic -F unsafe_code -D warnings
          done

  # ---------------------------------------------------------------------------
  # Tests. The domain suite touches no database, network or hardware, so it needs
  # no services here — that is the point of the sans-I/O core.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - run: cargo test --workspace --locked
      - name: doc examples compile
        run: cargo test --workspace --doc

  # ---------------------------------------------------------------------------
  # Both target platforms, because the store binary runs on Windows.
  # ---------------------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - run: cargo build --workspace --locked

      # The only runner in the estate with a PowerShell parser, so it is where the Windows
      # installer gets checked (issue #182). `dashboard/src/installers.mjs` emits both the
      # checked-in `deploy/edge/install-pos-edge.ps1` and the per-store script the new-store
      # wizard hands a technician; these run with administrator rights on a shop's only till, so
      # a parse error is a store that does not open. Bare `node` is enough — the generator is
      # plain ESM with no dependencies, so there is no pnpm install here.
      - name: the Windows installers parse
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          node dashboard/scripts/installer-syntax.mjs --emit "$env:RUNNER_TEMP/installers"
          $bad = 0
          foreach ($file in Get-ChildItem "$env:RUNNER_TEMP/installers" -Filter *.ps1) {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName, [ref]$null, [ref]$errors)
              if ($errors) {
                  Write-Host "::error file=deploy/edge/install-pos-edge.ps1::$($file.Name) does not parse"
                  $errors | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" }
                  $bad += 1
              } else {
                  Write-Host "ok $($file.Name)"
              }
          }
          if ($bad -gt 0) { exit 1 }

  # ---------------------------------------------------------------------------
  # The operator UI (P6). The Rust build embeds a placeholder on a fresh checkout
  # (ui/dist is gitignored), so this is the only job that actually compiles the
  # SolidJS app: it type-checks and builds it, which is what keeps a UI change
  # from landing broken even though CI does not embed the real bundle.
  # ---------------------------------------------------------------------------
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node ships on the runner; pnpm is installed pinned to the major the
      # lockfile was written with, and no remote action is added to the pinned-SHA
      # surface. `--frozen-lockfile` fails if ui/pnpm-lock.yaml is out of date.
      - name: install pnpm
        run: npm install --global pnpm@10
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: typecheck and build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # The browser half of the step gate (ADR-0109). `ui` above resolves the
  # declared taps against the source; this one clicks them in a real browser,
  # against a real `examples/minimal-edge`, and asserts each flow still reaches
  # its outcome. That is the half that catches a tap nobody declared — a
  # confirmation added to the pay flow leaves the static gate green and turns
  # this one red with the declaration untouched.
  #
  # The step order is load-bearing: the edge embeds `ui/dist` at compile time
  # (rust-embed, ADR-0018), so the UI is built first and the binary second, or
  # the browser drives a placeholder page.
  # ---------------------------------------------------------------------------
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - name: install pnpm
        run: npm install --global pnpm@10
      - name: install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: build the operator UI
        working-directory: ui
        run: pnpm build
      - name: build the example store
        run: cargo build -p minimal-edge --locked
      # Chromium only, and only the browser this project drives. `--with-deps`
      # installs the shared libraries a headless Chromium needs on a bare runner.
      - name: install the browser
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium
      - name: replay every declared flow
        working-directory: ui
        run: pnpm replay
      # The trace of a failed replay is the difference between "a tap did not
      # land" and knowing which one. Only on failure, and only for a fortnight.
      - name: keep the traces of whatever failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replay-traces
          path: ui/test-results/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The back-office dashboard (ADR-0060). Like `ui`, the Rust build embeds a
  # placeholder on a fresh checkout (dashboard/dist is gitignored), so this is
  # the only job that compiles the SolidJS app: it type-checks, runs the
  # no-hardcoded-strings lint, and builds it, keeping a dashboard change from
  # landing broken even though CI does not embed the real bundle.
  # ---------------------------------------------------------------------------
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install pnpm
        run: npm install --global pnpm@10
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: typecheck and build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Licences and advisories. The other check that turns architecture into law:
  # unwinding a copyleft crate after it ships inside a binary is a legal problem,
  # not an engineering one.
  # ---------------------------------------------------------------------------
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - name: install cargo-deny
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[cargo-deny\]/,/^\[just\]/p' tools/tool-versions.toml \
                     | sed -n 's/^version *= *"\(.*\)"/\1/p')"
          cargo install cargo-deny --locked --version "$version"
      - run: cargo deny --all-features check advisories licenses bans sources

  # ---------------------------------------------------------------------------
  # Secrets. A secret committed once is leaked forever, so this cannot be added
  # retroactively.
  # ---------------------------------------------------------------------------
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks
        # Downloaded and verified against a sha256 recorded in this repository,
        # rather than run through the official action: that action requires a paid
        # licence key for organisations, and this way needs no third party at all.
        run: |
          set -euo pipefail
          section="$(sed -n '/^\[gitleaks\]/,/^\[cargo-deny\]/p' tools/tool-versions.toml)"
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' <<<"$section")"
          expected="$(sed -n 's/^sha256_linux *= *"\(.*\)"/\1/p' <<<"$section")"
          url="$(sed -n 's/^url_linux *= *"\(.*\)"/\1/p' <<<"$section" | sed "s/{v}/$version/g")"
          curl -fsSL "$url" -o /tmp/gitleaks.tar.gz
          echo "$expected  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: scan the pull-request range
        run: gitleaks git --redact --verbose --log-opts="origin/${{ github.base_ref }}..HEAD"

  # ---------------------------------------------------------------------------
  # The SQL, against a real PostgreSQL, before merge rather than after.
  #
  # `test` above proves the domain, which touches no database — and that is the
  # point of the sans-I/O core. But `store-postgres` is nothing *but* SQL, and a
  # statement is only checked by a server that parses it. Two shipped statements
  # reached `main` broken because nothing here did:
  #
  #   * the store heartbeat, where `CASE WHEN … THEN NULL ELSE $3 END` left both
  #     arms unknown-typed and PostgreSQL deduced `$3` as `text` against the
  #     `bigint` the same parameter carried in the column list; and
  #   * the tax-rate save, where `$5::jsonb` made the *parameter* `jsonb`, which
  #     `tokio-postgres` then refused to serialise a Rust `String` into.
  #
  # Both compile. Both pass every fake. Both fail on the first real connection —
  # so a store's heartbeat and every tax-rate save were broken in production for
  # two merges, found only by reading a post-merge job nobody watches.
  #
  # This is its own job rather than a service on `test`, so the workspace suite
  # keeps its "no services" property and neither job waits on the other. The
  # suite is 92 cases in about twenty seconds; the file this was split out of
  # calls the pre-merge gate too slow for it, which the clock does not support.
  # MinIO and NATS stay in `main`: those need a `docker run` with a command a
  # service block cannot pass, which is a different cost.
  # ---------------------------------------------------------------------------
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Pinned by digest (postgres:16 as of this commit), not tag: a tag is
      # mutable, and a silently changed database version is a long afternoon.
      # Same digest `main` uses — two gates disagreeing on the version would be
      # worse than one.
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: poscloud
        ports:
          - 5432:5432
        # Do not start the test step until the database answers, or the first
        # connection races the container's boot and fails intermittently.
        options: >-
          --health-cmd "pg_isready -U pos -d poscloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # libpq key=value form. `pos` is the image's superuser, so it owns `events`
      # and bypasses the row-level policy — which is what the trusted ingest
      # adapter does; the RLS cases drop to the `app_tenant` role to prove the
      # policy still bites.
      DATABASE_URL: "host=localhost port=5432 user=pos password=pos dbname=poscloud"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - name: store-postgres against a real PostgreSQL
        # Single-threaded: every case shares the one database and truncates
        # between cases (see the crate's tests/integration.rs).
        run: cargo test -p store-postgres --features integration --locked -- --test-threads=1

  # ---------------------------------------------------------------------------
  # Documentation gates. Deliberately escapable with an explicit sentence: the
  # goal is a conscious decision, not a bureaucratic block.
  # ---------------------------------------------------------------------------
  docs-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: a code change touches CHANGELOG.md, or says why not
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "origin/$BASE"...HEAD)"
          if ! grep -qE '^(crates/|ui/|dashboard/)' <<<"$changed"; then
            echo "no change under crates/, ui/ or dashboard/; gate not applicable"
            exit 0
          fi
          if grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo "changelog updated"
            exit 0
          fi
          # The escape needs the sentence AND a reason after it, so a bare
          # "changelog: none" does not pass.
          if grep -qiE '^[[:space:]]*changelog:[[:space:]]*none[[:space:]]+\S+' <<<"$PR_BODY"; then
            echo "changelog deliberately skipped, with a stated reason"
            exit 0
          fi
          echo "::error::This pull request changes crates/, ui/ or dashboard/ but does not touch CHANGELOG.md. Add an entry under [Unreleased], or write 'changelog: none <reason>' in the pull-request body."
          exit 1
