name: pr

# The gate every pull request passes. Target: under ten minutes, enforced by
# `timeout-minutes` on each job rather than left as an aspiration — a target
# nothing measures is a wish.
#
# Jobs run in parallel, and each is ordered internally so the cheapest failure
# surfaces first. A contributor with a naming mistake should not wait for a full
# clippy pass to hear about it.

# A push to `main` runs it too. That is what saves the caches pull requests restore,
# since a cache is saved only from `main` and only matches the job that wrote it
# (ADR-0171 decision 1), and it is ADR-0171's "main always runs everything". The jobs
# that read the pull request itself (`secrets`, `docs-gate`) run on pull requests only.
on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's newer push cancels its older run; runs on `main` queue instead,
# so each one gets to save its caches.
concurrency:
  group: pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The build environment is part of every cache key (ADR-0171 decision 1), so these
# values are the same in pr.yml and main.yml; a difference is a full cache miss.
#   No incremental build and no debug info: CI compiles each crate once and reads no
#   debugger symbols, and both make `target/` larger and slower to restore. Developers
#   keep theirs: Cargo.toml's profiles are untouched.
#   mold on Linux, through the target's own rustflags so the Windows build keeps its
#   linker. A RUSTFLAGS variable, if one is ever set, takes precedence over these, so it
#   must then carry the mold flag too.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  # ---------------------------------------------------------------------------
  # What this change touches (ADR-0171 decision 2). The other jobs read these
  # classes to decide whether they can be affected; `cargo xtask affected` holds
  # the rules, and its tests say what each class means.
  #
  # Every job that reads it is written so a failure here runs it anyway:
  # `!cancelled() && (needs.changes.result != 'success' || <class>)`. Without
  # that, a broken classifier would skip every job, and a skipped job passes a
  # required check. A push to `main` or a schedule passes `--all`, so it runs
  # everything. The `rules`, `secrets` and `docs-gate` jobs never wait on this.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.classes.outputs.rust }}
      rust_all: ${{ steps.classes.outputs.rust_all }}
      ui: ${{ steps.classes.outputs.ui }}
      dashboard: ${{ steps.classes.outputs.dashboard }}
      shared: ${{ steps.classes.outputs.shared }}
      docs_only: ${{ steps.classes.outputs.docs_only }}
      workflows: ${{ steps.classes.outputs.workflows }}
      deploy: ${{ steps.classes.outputs.deploy }}
      # The crates a change can affect, as cargo arguments: `--workspace`, `-p a -p b`, or
      # empty when no Rust is affected.
      packages: ${{ steps.classes.outputs.packages }}
      # The same for `cargo test --doc`, which only crates with a library take; `none` if no
      # affected crate has one.
      doc_packages: ${{ steps.classes.outputs.doc_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base with the base branch, to diff against.
          fetch-depth: 0
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: changes
      - id: classes
        name: classify the changed paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            cargo run -q -p xtask -- affected --classes --crates --base "origin/$BASE" | tee -a "$GITHUB_OUTPUT"
          else
            cargo run -q -p xtask -- affected --classes --crates --all | tee -a "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Repository rules. No heavy compilation, so this is the fastest signal.
  # ---------------------------------------------------------------------------
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changed-file gates need the base branch.
          fetch-depth: 0
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: rules

      - name: dependency rule
        run: cargo run -q -p xtask -- deps-rule
      - name: per-crate clippy.toml restates the baseline
        run: cargo run -q -p xtask -- lint-config
      - name: every action pinned to a commit SHA
        run: cargo run -q -p xtask -- actions-pinned
      - name: internal documentation links resolve
        run: cargo run -q -p xtask -- links
      - name: every country module is named, wired in, and selectable
        run: cargo run -q -p xtask -- countries
      - name: every crate has a README and a contract card that agree with the workspace
        run: cargo run -q -p xtask -- crates --check
      - name: docs/generated is what the tree generates
        run: cargo run -q -p xtask -- gen-docs --check
      # On a pull request the baseline may only shrink against the merge base, unless the body
      # says `size-baseline: grow <reason>`. On a push to main it is compared with the parent
      # commit and growth only warns, since the pull request already passed.
      - name: no file or function grows past the size rules (ADR-0170)
        env:
          POS_PR_BODY: ${{ github.event.pull_request.body }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            cargo run -q -p xtask -- code-stats --check --base "origin/$BASE"
          else
            cargo run -q -p xtask -- code-stats --check --base HEAD^ --baseline-growth warn
          fi
      - name: the files both front ends share live once, in packages/shared
        run: cargo run -q -p xtask -- mirrored-files
      - name: no vendor brand name in pos-core / pos-proto production code
        run: cargo run -q -p xtask -- vendor-neutral-core
      - name: the print agent links only the three workspace crates ADR-0112 allows
        run: cargo run -q -p xtask -- print-agent-deps
      - name: every accepted TLS_MODE has its Caddyfile and imports the shared block
        run: cargo run -q -p xtask -- tls-modes
      - name: nothing removed from a committed snapshot
        run: cargo run -q -p xtask -- snapshot --base origin/${{ github.base_ref || 'main' }}
      - name: migrations are additive-only
        run: cargo run -q -p xtask -- migrations --base origin/${{ github.base_ref || 'main' }}

      # The dependency rule is the check that turns the architecture into law, so
      # prove it still fires rather than trusting that it would. Runs against a
      # throwaway copy of the tree.
      - name: the dependency rule rejects tokio in the domain
        run: bash xtask/tests/deps_rule_e2e.sh

  # ---------------------------------------------------------------------------
  # Formatting and lints, including the backbone pass that cannot be escaped.
  # ---------------------------------------------------------------------------
  lints:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.deploy == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The affected crates (`cargo xtask affected --crates`); everything when `changes` failed.
      PACKAGES: ${{ needs.changes.outputs.packages || '--workspace' }}
      RUN_RUST: ${{ needs.changes.result != 'success' || needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        if: env.RUN_RUST == 'true'
        with:
          cache-key: lints

      - run: cargo fmt --all -- --check
        if: env.RUN_RUST == 'true'

      - name: clippy (affected crates)
        if: env.RUN_RUST == 'true'
        # PACKAGES is `--workspace` or `-p name …` from xtask, split into arguments.
        run: |
          read -ra args <<<"$PACKAGES"
          cargo clippy "${args[@]}" --all-targets --all-features -- -D warnings

      # Not redundant with the pass above. A source-level `#![allow]` overrides a
      # `deny` inherited from [workspace.lints], so that table is not a floor.
      # `--forbid` cannot be overridden — `allow` against `forbid` is E0453 — and
      # this pass is the only thing making the backbone's no-panic and no-float
      # rules unescapable rather than conventional.
      # The backbone changes only through a run-everything path, so `--workspace` is when it can.
      - name: clippy (backbone, unescapable)
        if: env.RUN_RUST == 'true' && env.PACKAGES == '--workspace'
        run: |
          for crate in pos-core pos-ports pos-proto; do
            cargo clippy -p "$crate" --all-targets -- \
              -F clippy::unwrap_used -F clippy::expect_used -F clippy::panic \
              -F clippy::todo -F clippy::unimplemented \
              -F clippy::print_stdout -F clippy::print_stderr \
              -F clippy::float_arithmetic -F unsafe_code -D warnings
          done

      # bootstrap.sh is shipped to a box over SSH and run there, so every gate in this file was
      # green through five consecutive deploy failures inside it. This runs its cloud.toml reconcile
      # block against the file states a real box presents — including the one that broke deploy #19,
      # where answering "the key is already there" exited the script under `set -e`.
      - name: deploy/bootstrap.sh cloud.toml reconciles
        run: bash deploy/tests/cloud-toml-reconcile.sh

  # ---------------------------------------------------------------------------
  # Tests. The domain suite touches no database, network or hardware, so it needs
  # no services here — that is the point of the sans-I/O core.
  # ---------------------------------------------------------------------------
  # The tests, built once and run in shards (ADR-0171 decision 2). `test-archive`
  # compiles the affected crates' tests into a nextest archive; `test-shard` runs
  # it in three partitions at once; `test-doc` runs the doc tests, which nextest
  # does not; and `test`, the required check, passes only when they did.
  test-archive:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PACKAGES: ${{ needs.changes.outputs.packages || '--workspace' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: test
      - uses: ./.github/actions/nextest-setup
      # PACKAGES is `--workspace` or `-p name …` from xtask, split into arguments.
      - name: build the tests into one archive
        run: |
          read -ra args <<<"$PACKAGES"
          cargo nextest archive "${args[@]}" --locked --archive-file "$RUNNER_TEMP/tests.tar.zst"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/tests.tar.zst
          retention-days: 1
          if-no-files-found: error

  test-shard:
    needs: [changes, test-archive]
    if: ${{ !cancelled() && needs.test-archive.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The archive holds the test binaries; the checkout is the files they read at run time
      # (snapshots, fixtures), mapped back in with --workspace-remap.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A few tests run `cargo metadata`, so the pinned toolchain must be on the path. No cache:
      # nothing is compiled here.
      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/nextest-setup
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      - name: run shard ${{ matrix.shard }} of 3
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cargo nextest run --profile ci --archive-file "$RUNNER_TEMP/tests.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE" --partition "count:$SHARD/3"

  test-doc:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOC_PACKAGES: ${{ needs.changes.outputs.doc_packages || '--workspace' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.DOC_PACKAGES != 'none'
      - uses: ./.github/actions/rust-setup
        if: env.DOC_PACKAGES != 'none'
        with:
          cache-key: test-doc
      - name: doc examples compile
        if: env.DOC_PACKAGES != 'none'
        run: |
          read -ra args <<<"$DOC_PACKAGES"
          cargo test "${args[@]}" --doc

  # The required check. It always runs, so it always reports, and it reads its
  # dependencies' results rather than inheriting a skip: a shard skipped because the
  # archive failed is a failure here, never a silent pass.
  test:
    needs: [changes, test-archive, test-shard, test-doc]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every test job passed, or none had anything to run
        env:
          CHANGES: ${{ needs.changes.result }}
          RUST: ${{ needs.changes.outputs.rust }}
          ARCHIVE: ${{ needs.test-archive.result }}
          SHARDS: ${{ needs.test-shard.result }}
          DOCS: ${{ needs.test-doc.result }}
        run: |
          echo "changes=$CHANGES rust=$RUST archive=$ARCHIVE shards=$SHARDS doc=$DOCS"
          if [ "$CHANGES" != "success" ] || [ "$RUST" = "true" ]; then
            # Rust is affected (or the classifier failed, so everything ran): all must pass.
            for result in "$ARCHIVE" "$SHARDS" "$DOCS"; do
              [ "$result" = "success" ] || { echo "::error::a test job did not succeed ($result)"; exit 1; }
            done
          else
            # Nothing to test: skipped is fine, anything else is not.
            for result in "$ARCHIVE" "$SHARDS" "$DOCS"; do
              case "$result" in success|skipped) ;; *) echo "::error::a test job ended $result"; exit 1;; esac
            done
          fi

  # ---------------------------------------------------------------------------
  # Both target platforms, because the store binary runs on Windows.
  # ---------------------------------------------------------------------------
  # A matrix job skipped as a whole reports one check named `build`, not one per
  # matrix entry, so a required `build (…)` check would wait forever. So this job
  # always runs, and its steps decide: they skip, and the job passes, when nothing
  # it checks has changed.
  build:
    needs: changes
    if: ${{ !cancelled() }}
    env:
      RUN_RUST: ${{ needs.changes.result != 'success' || needs.changes.outputs.rust == 'true' }}
      PACKAGES: ${{ needs.changes.outputs.packages || '--workspace' }}
      RUN_INSTALLERS: ${{ needs.changes.result != 'success' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.deploy == 'true' || needs.changes.outputs.dashboard == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_RUST == 'true' || env.RUN_INSTALLERS == 'true'
      - uses: ./.github/actions/rust-setup
        if: env.RUN_RUST == 'true'
        with:
          cache-key: build
      # PACKAGES is `--workspace` or `-p name …` from xtask, split into arguments. Bash on
      # Windows too, where the default shell would not read `$PACKAGES`.
      - run: |
          read -ra args <<<"$PACKAGES"
          cargo build "${args[@]}" --locked
        if: env.RUN_RUST == 'true'
        shell: bash

      # The only runner in the estate with a PowerShell parser, so it is where the Windows
      # installer gets checked (issue #182). `dashboard/src/installers.mjs` emits both the
      # checked-in `deploy/edge/install-pos-edge.ps1` and the per-store script the new-store
      # wizard hands a technician; these run with administrator rights on a shop's only till, so
      # a parse error is a store that does not open. Bare `node` is enough — the generator is
      # plain ESM with no dependencies, so there is no pnpm install here.
      # Emit once, then parse with BOTH PowerShell editions. `pwsh` is 7, which decodes a script as
      # UTF-8 whether or not it carries a byte-order mark; `powershell` is Windows PowerShell 5.1,
      # which decodes a BOM-less script as ANSI in the machine's code page. A shop types
      # `powershell`, so 5.1 is the reader that decides whether a store opens.
      #
      # That gap shipped a defect. The scripts carried em dashes and no BOM: 5.1 read `E2 80 94` as
      # `â`, `€` and `”` — U+201D, which the parser accepts as a double-quote delimiter — so the
      # first `Write-Host` containing one opened a string that swallowed the rest of the line and
      # the script died at parse time. This job passed the whole time, because it only ever asked
      # the edition that cannot see it. The BOM is the fix (`PS_BOM` in `src/installers.mjs`);
      # asking 5.1 is what proves it, and what stops the next one.
      - name: emit the Windows installers
        if: matrix.os == 'windows-2022' && env.RUN_INSTALLERS == 'true'
        shell: pwsh
        run: node dashboard/scripts/installer-syntax.mjs --emit "$env:RUNNER_TEMP/installers"

      - name: the Windows installers parse (PowerShell 7)
        if: matrix.os == 'windows-2022' && env.RUN_INSTALLERS == 'true'
        shell: pwsh
        run: |
          $bad = 0
          foreach ($file in Get-ChildItem "$env:RUNNER_TEMP/installers" -Filter *.ps1) {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName, [ref]$null, [ref]$errors)
              if ($errors) {
                  Write-Host "::error file=deploy/edge/install-pos-edge.ps1::$($file.Name) does not parse under pwsh 7"
                  $errors | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" }
                  $bad += 1
              } else {
                  Write-Host "ok $($file.Name)"
              }
          }
          if ($bad -gt 0) { exit 1 }

      # This step's own script must be pure ASCII, and the first version of it was not — it carried
      # an em dash and failed under 5.1 with the identical parse error it exists to catch. The
      # runner writes a `shell: powershell` step to a `.ps1` **without** a byte-order mark, and
      # nothing here can add one: the fix that works for a file we generate is unavailable for a
      # file the runner generates for us. So: no non-ASCII below this line.
      - name: the Windows installers parse (Windows PowerShell 5.1, what a shop runs)
        if: matrix.os == 'windows-2022' && env.RUN_INSTALLERS == 'true'
        shell: powershell
        run: |
          $bad = 0
          foreach ($file in Get-ChildItem "$env:RUNNER_TEMP/installers" -Filter *.ps1) {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName, [ref]$null, [ref]$errors)
              if ($errors) {
                  Write-Host "::error file=deploy/edge/install-pos-edge.ps1::$($file.Name) does not parse under Windows PowerShell 5.1, the edition a technician gets by typing ``powershell``. Check the byte-order mark."
                  $errors | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" }
                  $bad += 1
              } else {
                  Write-Host "ok $($file.Name)"
              }
          }
          if ($bad -gt 0) { exit 1 }

  # ---------------------------------------------------------------------------
  # The operator UI (P6). The Rust build embeds a placeholder on a fresh checkout
  # (ui/dist is gitignored), so this is the only job that actually compiles the
  # SolidJS app: it type-checks and builds it, which is what keeps a UI change
  # from landing broken even though CI does not embed the real bundle.
  # ---------------------------------------------------------------------------
  ui:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `node-setup` installs the pinned pnpm major, retrying a failed fetch --
      # see that action for what a bare install cost. `--frozen-lockfile` fails if
      # ui/pnpm-lock.yaml is out of date.
      - uses: ./.github/actions/node-setup
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: the size rules (ESLint, ADR-0172)
        run: pnpm lint
      - name: typecheck and build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # The browser half of the step gate (ADR-0109). `ui` above resolves the
  # declared taps against the source; this one clicks them in a real browser,
  # against a real `examples/minimal-edge`, and asserts each flow still reaches
  # its outcome. That is the half that catches a tap nobody declared — a
  # confirmation added to the pay flow leaves the static gate green and turns
  # this one red with the declaration untouched.
  #
  # The step order is load-bearing: the edge embeds `ui/dist` at compile time
  # (rust-embed, ADR-0018), so the UI is built first and the binary second, or
  # the browser drives a placeholder page.
  # ---------------------------------------------------------------------------
  # The replay, built once and run in three shards (ADR-0171 decision 2). `replay-build`
  # builds the UI and the example store that embeds it; `replay-shard` runs a third of
  # the flows each against that binary; `replay`, the required check, passes only when
  # they did.
  replay-build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: replay
      - uses: ./.github/actions/node-setup
      - name: install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: build the operator UI
        working-directory: ui
        run: pnpm build
      # `minimal-edge` embeds ui/dist at compile time, so the UI is built first.
      - name: build the example store
        run: cargo build -p minimal-edge --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replay-edge
          path: target/debug/minimal-edge
          retention-days: 1
          if-no-files-found: error

  replay-shard:
    needs: [changes, replay-build]
    if: ${{ !cancelled() && needs.replay-build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-setup
      - name: install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      # Where the harness looks for it (ui/tests/edge.mjs). An artifact loses the executable bit.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: replay-edge
          path: target/debug
      - run: chmod +x target/debug/minimal-edge
      # Chromium only, and only the browser this project drives. `--with-deps`
      # installs the shared libraries a headless Chromium needs on a bare runner.
      - name: install the browser
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium
      # `fullyParallel` in playwright.config.mjs is what lets one spec file split by test.
      - name: replay a third of the declared flows
        working-directory: ui
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm replay --shard="$SHARD/3"
      # What broke, where a reader will actually find it. A failed replay's assertion
      # is somewhere in the middle of the log — for `console-replay`, thousands of
      # lines above the end, because the runner dumps the Postgres service
      # container's output at teardown. The summary is its own surface and says the
      # failing flow and its locator whatever the log carries.
      - name: say which flow failed
        if: failure()
        run: node .github/scripts/replay-summary.mjs ui/test-results/report.json >> "$GITHUB_STEP_SUMMARY"
      # The trace of a failed replay is the difference between "a tap did not
      # land" and knowing which one. Only on failure, and only for a fortnight.
      - name: keep the traces of whatever failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replay-traces-${{ matrix.shard }}
          path: ui/test-results/
          retention-days: 14

  # The required check, with `test`'s pattern: it always runs and reads the results,
  # so a shard skipped because the build failed is a failure, never a silent pass.
  replay:
    needs: [changes, replay-build, replay-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every replay job passed, or none had anything to run
        env:
          CHANGES: ${{ needs.changes.result }}
          AFFECTED: ${{ needs.changes.outputs.ui == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.rust == 'true' }}
          BUILD: ${{ needs.replay-build.result }}
          SHARDS: ${{ needs.replay-shard.result }}
        run: |
          echo "changes=$CHANGES affected=$AFFECTED build=$BUILD shards=$SHARDS"
          if [ "$CHANGES" != "success" ] || [ "$AFFECTED" = "true" ]; then
            for result in "$BUILD" "$SHARDS"; do
              [ "$result" = "success" ] || { echo "::error::a replay job did not succeed ($result)"; exit 1; }
            done
          else
            for result in "$BUILD" "$SHARDS"; do
              case "$result" in success|skipped) ;; *) echo "::error::a replay job ended $result"; exit 1;; esac
            done
          fi

  # ---------------------------------------------------------------------------
  # The browser half of the *console's* step gate (ADR-0109). `dashboard` below
  # resolves each declared click against the source; this one clicks it in a real
  # browser, against a real `pos_cloud` on a real PostgreSQL, and asserts the
  # flow still reaches its outcome. That is the half that catches a click nobody
  # declared — a picker added to the cohort publish leaves the static gate green
  # and turns this one red with the declaration untouched.
  #
  # The step order is load-bearing: `pos_cloud` embeds `dashboard/dist` at
  # compile time (rust-embed, ADR-0060), so the console is built first and the
  # binary second, or the browser drives a placeholder page.
  # ---------------------------------------------------------------------------
  console-replay:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      # Same pinned digest the `postgres` job uses: two gates disagreeing on the
      # database version would be worse than one.
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: poscloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d poscloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The *server*, not a database: the harness creates one of its own per run
      # and drops it afterwards, because `/admin/setup` enrols once per
      # installation and its TOTP secret is returned once (ADR-0045).
      POS_E2E_POSTGRES: "postgres://pos:pos@127.0.0.1:5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: console-replay
      - uses: ./.github/actions/node-setup
      - name: install dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile
      - name: build the console
        working-directory: dashboard
        run: pnpm build
      - name: build the cloud
        run: cargo build -p pos-cloud --locked
      # `store-postgres` recycles every pooled connection with `ROLLBACK`, which is
      # load-bearing: a `PgTx` dropped without commit or rollback would otherwise
      # hand the next caller a connection inside a leaked transaction. Its own
      # comment says the no-op case "is a harmless no-op (a warning, not an error)"
      # — and so it is, once. A browser suite makes thousands, and the runner dumps
      # them into this job's log at teardown, which is what buried the one failure
      # this gate exists to show. The warning is expected here, so the server is
      # told not to log it; an `ERROR` still is.
      - name: quieten the expected recycle warning
        run: |
          PGPASSWORD=pos psql -h 127.0.0.1 -U pos -d poscloud -v ON_ERROR_STOP=1 -c \
            "ALTER SYSTEM SET log_min_messages = 'error'" -c "SELECT pg_reload_conf()"
      # Chromium only, and only the browser this project drives. `--with-deps`
      # installs the shared libraries a headless Chromium needs on a bare runner.
      - name: install the browser
        working-directory: dashboard
        run: pnpm exec playwright install --with-deps chromium
      - name: replay every declared console flow
        working-directory: dashboard
        run: pnpm replay
      # What broke, where a reader will actually find it. A failed replay's assertion
      # is somewhere in the middle of the log — for `console-replay`, thousands of
      # lines above the end, because the runner dumps the Postgres service
      # container's output at teardown. The summary is its own surface and says the
      # failing flow and its locator whatever the log carries.
      - name: say which flow failed
        if: failure()
        run: node .github/scripts/replay-summary.mjs dashboard/test-results/report.json >> "$GITHUB_STEP_SUMMARY"
      # The trace of a failed replay is the difference between "a click did not
      # land" and knowing which one. Only on failure, and only for a fortnight.
      - name: keep the traces of whatever failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-replay-traces
          path: dashboard/test-results/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The back-office dashboard (ADR-0060). Like `ui`, the Rust build embeds a
  # placeholder on a fresh checkout (dashboard/dist is gitignored), so this is
  # the only job that compiles the SolidJS app: it type-checks, runs the
  # no-hardcoded-strings lint, and builds it, keeping a dashboard change from
  # landing broken even though CI does not embed the real bundle.
  # ---------------------------------------------------------------------------
  dashboard:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.deploy == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-setup
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: the size rules (ESLint, ADR-0172)
        run: pnpm lint
      - name: typecheck and build
        run: pnpm build

      # The gate three deploy failures needed and did not have.
      #
      # `deploy/Dockerfile`'s dashboard stage copies `dashboard/` AND NOTHING ELSE, then runs
      # `pnpm build`. So anything chained into that script may read only `dashboard/`. Twice now a
      # check that reads `deploy/edge/*.ps1` has been chained in — added, removed in #228 to
      # unblock the image, re-added in #269 to give the drift gate a home — and both times the
      # break surfaced in a **production deploy**, because this job runs against a full checkout
      # where the path resolves and the image is the only place it does not.
      #
      # This reproduces the image's condition exactly and cheaply: the same tree the Dockerfile
      # copies, nothing above it, node_modules reused so there is no second install. It fails on
      # any future script that reaches outside `dashboard/`, not just the two that already have.
      - name: the image condition — pnpm build with only dashboard/ and packages/shared/ on disk
        working-directory: .
        run: |
          set -euo pipefail
          isolated="$(mktemp -d)"
          cp -r dashboard "$isolated/dashboard"
          mkdir -p "$isolated/packages"
          cp -r packages/shared "$isolated/packages/shared"
          test ! -e "$isolated/deploy" # the whole point: deploy/ is out of reach
          cd "$isolated/dashboard"
          pnpm build
          echo "ok: the dashboard builds with only packages/shared beside it, so the cloud image will too"

  # ---------------------------------------------------------------------------
  # Licences and advisories. The other check that turns architecture into law:
  # unwinding a copyleft crate after it ships inside a binary is a legal problem,
  # not an engineering one.
  # ---------------------------------------------------------------------------
  deny:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: deny
      - name: install cargo-deny
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[cargo-deny\]/,/^\[just\]/p' tools/tool-versions.toml \
                     | sed -n 's/^version *= *"\(.*\)"/\1/p')"
          cargo install cargo-deny --locked --version "$version"
      - run: cargo deny --all-features check advisories licenses bans sources

  # ---------------------------------------------------------------------------
  # Secrets. A secret committed once is leaked forever, so this cannot be added
  # retroactively.
  # ---------------------------------------------------------------------------
  secrets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks
        # Downloaded and verified against a sha256 recorded in this repository,
        # rather than run through the official action: that action requires a paid
        # licence key for organisations, and this way needs no third party at all.
        run: |
          set -euo pipefail
          section="$(sed -n '/^\[gitleaks\]/,/^\[/p' tools/tool-versions.toml)"
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' <<<"$section")"
          expected="$(sed -n 's/^sha256_linux *= *"\(.*\)"/\1/p' <<<"$section")"
          url="$(sed -n 's/^url_linux *= *"\(.*\)"/\1/p' <<<"$section" | sed "s/{v}/$version/g")"
          curl -fsSL "$url" -o /tmp/gitleaks.tar.gz
          echo "$expected  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: scan the pull-request range
        run: gitleaks git --redact --verbose --log-opts="origin/${{ github.base_ref }}..HEAD"

  # ---------------------------------------------------------------------------
  # The SQL, against a real PostgreSQL, before merge rather than after.
  #
  # `test` above proves the domain, which touches no database — and that is the
  # point of the sans-I/O core. But `store-postgres` is nothing *but* SQL, and a
  # statement is only checked by a server that parses it. Two shipped statements
  # reached `main` broken because nothing here did:
  #
  #   * the store heartbeat, where `CASE WHEN … THEN NULL ELSE $3 END` left both
  #     arms unknown-typed and PostgreSQL deduced `$3` as `text` against the
  #     `bigint` the same parameter carried in the column list; and
  #   * the tax-rate save, where `$5::jsonb` made the *parameter* `jsonb`, which
  #     `tokio-postgres` then refused to serialise a Rust `String` into.
  #
  # Both compile. Both pass every fake. Both fail on the first real connection —
  # so a store's heartbeat and every tax-rate save were broken in production for
  # two merges, found only by reading a post-merge job nobody watches.
  #
  # This is its own job rather than a service on `test`, so the workspace suite
  # keeps its "no services" property and neither job waits on the other. The
  # suite is 92 cases in about twenty seconds; the file this was split out of
  # calls the pre-merge gate too slow for it, which the clock does not support.
  # Garage and NATS stay in `main`: neither fits a `services:` block — NATS needs
  # a command it cannot pass, Garage needs its config mounted and a layout
  # assigned before it answers — which is a different cost.
  # ---------------------------------------------------------------------------
  postgres:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Pinned by digest (postgres:16 as of this commit), not tag: a tag is
      # mutable, and a silently changed database version is a long afternoon.
      # Same digest `main` uses — two gates disagreeing on the version would be
      # worse than one.
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: poscloud
        ports:
          - 5432:5432
        # Do not start the test step until the database answers, or the first
        # connection races the container's boot and fails intermittently.
        options: >-
          --health-cmd "pg_isready -U pos -d poscloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # libpq key=value form. `pos` is the image's superuser, so it owns `events`
      # and bypasses the row-level policy — which is what the trusted ingest
      # adapter does; the RLS cases drop to the `app_tenant` role to prove the
      # policy still bites.
      DATABASE_URL: "host=localhost port=5432 user=pos password=pos dbname=poscloud"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: postgres
      - name: store-postgres against a real PostgreSQL
        # Single-threaded: every case shares the one database and truncates
        # between cases (see the crate's tests/integration.rs).
        run: cargo test -p store-postgres --features integration --locked -- --test-threads=1

  # ---------------------------------------------------------------------------
  # Documentation gates. Deliberately escapable with an explicit sentence: the
  # goal is a conscious decision, not a bureaucratic block. A Dependabot pull
  # request that changes only manifests and lockfiles needs no change file;
  # `cargo xtask changelog --exempt` decides that, and its tests hold the rule.
  # ---------------------------------------------------------------------------
  docs-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The rules job's cache: it builds the same xtask, and docs-gate never runs on
      # main to save one of its own.
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: rules
      - name: a code change touches CHANGELOG.md, or says why not
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "origin/$BASE"...HEAD)"
          if ! grep -qE '^(crates/|ui/|dashboard/)' <<<"$changed"; then
            echo "no change under crates/, ui/ or dashboard/; gate not applicable"
            exit 0
          fi
          exempt="$(cargo run -q -p xtask --locked -- changelog --exempt --base "origin/$BASE")"
          if [ "$exempt" = "true" ]; then
            echo "a Dependabot bump of manifests and lockfiles only; no change file needed"
            exit 0
          fi
          # A change file under changes/ (ADR-0170 decision 5), added or edited,
          # is the entry; so is an edit to CHANGELOG.md itself.
          entries="$(git diff --name-only --diff-filter=AM "origin/$BASE"...HEAD -- 'changes/*.md')"
          others="$(grep -vx 'changes/README.md' <<<"$entries" || true)"
          if [ -n "$others" ]; then
            echo "change file added"
            exit 0
          fi
          if grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo "changelog updated"
            exit 0
          fi
          # The escape needs the sentence AND a reason after it, so a bare
          # "changelog: none" does not pass.
          if grep -qiE '^[[:space:]]*changelog:[[:space:]]*none[[:space:]]+\S+' <<<"$PR_BODY"; then
            echo "changelog deliberately skipped, with a stated reason"
            exit 0
          fi
          echo "::error::This pull request changes crates/, ui/ or dashboard/ but adds no change file. Add changes/<topic>.md (see changes/README.md), or write 'changelog: none <reason>' in the pull-request body."
          exit 1
      - name: every change file is well-formed
        run: cargo run -q -p xtask --locked -- changelog --check

  # ---------------------------------------------------------------------------
  # What this change affects, as one comment on the pull request (ADR-0171
  # decision 2): the path classes, the affected crates, the snapshots and
  # generated docs, and which jobs run or skip. `cargo xtask impact` writes it,
  # and its tests hold its job list to this file.
  #
  # Informational: no check requires it, and posting the comment never fails
  # the run. A fork's token cannot write, so a fork gets the step summary only.
  # The pull request's own text never reaches a script: the report goes through
  # a file, and the comment body is read from that file.
  # ---------------------------------------------------------------------------
  impact:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base with the base branch, to diff against.
          fetch-depth: 0
      # The rules job's cache: it builds the same xtask, and this job never runs on main.
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: rules
      - name: work out what the change affects
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          cargo run -q -p xtask --locked -- impact --base "origin/$BASE" > "$RUNNER_TEMP/impact.md"
          cat "$RUNNER_TEMP/impact.md" >> "$GITHUB_STEP_SUMMARY"
      # Edits this job's earlier comment, found by the marker the report starts with, rather
      # than adding one per push.
      - name: post it on the pull request, or update the earlier comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # All matching ids, then the first in shell: piping into `head` could SIGPIPE `gh`.
          ids="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- xtask-impact -->"))) | .id')"
          id="${ids%%$'\n'*}"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F "body=@$RUNNER_TEMP/impact.md" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F "body=@$RUNNER_TEMP/impact.md" > /dev/null
          fi
