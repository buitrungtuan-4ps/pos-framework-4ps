[package]
name        = "pos-till-rules"
version     = "0.1.0"
description = "The till's rules module: pos-rules and pos-core's flow engine, compiled to wasm32 behind a small JSON boundary."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
repository.workspace   = true

[lib]
# `cdylib` is the module the till loads (built for `wasm32-unknown-unknown`); `rlib` is what this
# crate's own tests link.
crate-type = ["cdylib", "rlib"]

[dependencies]
pos-core = { path = "../pos-core" }
pos-proto = { path = "../pos-proto" }
pos-rules = { path = "../pos-rules" }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.pos]
layer = "adapter"
purpose = "The till's rules module: pos-rules and pos-core's flow engine compiled to wasm32, answered over a JSON boundary."
adrs = [192, 193, 202]
owners = ["@maintainers-architecture"]
