[package]
name        = "pos-simulator"
version     = "0.0.0"
description = "The virtual-fleet simulator: an executable capacity model and deterministic fleet scenarios (P12)."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
repository.workspace   = true

[lib]
name = "pos_simulator"

[dependencies]
# P12a (the capacity model) is pure integer arithmetic over the published sizing formulas and needs no
# backbone crate. P12b adds pos-core (ota::decide_rollout), pos-ports, and pos-fakes for the fleet
# behavioral scenarios; those dependency lines land with that slice so this one stays minimal.

[lints]
# The simulator declares its OWN lint table (like the binaries), per the workspace comment: it is a
# harness, not a shipped library, so it is exempt from the strict library baseline. The money, no-PII,
# and no-float rules stay on — capacity arithmetic must be integer, never float — and `allow_attributes`
# is denied so any suppression is an `#[expect(... reason = ...)]`. unwrap/expect/panic are left at
# their defaults, which a scenario harness may use where a failure is a test-setup fault anyway.
[lints.rust]
unsafe_code                   = "deny"
missing_docs                  = "warn"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"
unused_qualifications         = "warn"

[lints.clippy]
all      = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

float_arithmetic    = "deny"
lossy_float_literal = "deny"
cast_precision_loss = "deny"

allow_attributes                = "deny"
allow_attributes_without_reason = "deny"
