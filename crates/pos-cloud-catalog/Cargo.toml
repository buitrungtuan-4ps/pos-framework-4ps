[package]
name        = "pos-cloud-catalog"
version     = "0.0.0"
description = "The cloud's catalog with its fees: the item master, menus, fee rules, media, tax rates, the translation grid, the CSV import and export, and their routes and stores."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
repository.workspace   = true

# Moved out of pos-cloud (ADR-0170 decision 4, ADR-0175 decision 2), with the same dependencies at
# the same versions: this crate adds edges to crates already in the lockfile, and nothing new.
[dependencies]
pos-cloud-api     = { path = "../pos-cloud-api" }
pos-cloud-config  = { path = "../pos-cloud-config" }
# The revenue CSV writers the catalog's export module re-exports beside the item master's.
pos-cloud-reports = { path = "../pos-cloud-reports" }
pos-core          = { path = "../pos-core" }
# `openapi`: the wire types this crate's records carry need their schemas (ADR-0177, ADR-0180).
pos-proto         = { path = "../pos-proto", features = ["openapi"] }
# The catalog, fee-rule, media, tax-rate and translation tables (ADR-0016). This crate implements
# its store traits for them, since a trait can be implemented for another crate's type only where
# the trait is defined.
store-postgres = { path = "../adapters/store-postgres" }

tokio      = { version = "1", features = ["rt", "sync", "time"] }
axum       = "0.8"
tracing    = "0.1"
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
utoipa     = "6"
# Media renditions are decoded and re-encoded in-process (ADR-0075), and the item master is read and
# written as CSV, as they were in pos-cloud.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
csv   = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# The same lint table as pos-cloud, which this code came from.
[lints.rust]
unsafe_code                   = "deny"
missing_docs                  = "warn"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"
unused_qualifications         = "warn"

[lints.clippy]
all      = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

float_arithmetic    = "deny"
lossy_float_literal = "deny"
cast_precision_loss = "deny"

print_stdout = "deny"
print_stderr = "deny"
dbg_macro    = "deny"

allow_attributes                = "deny"
allow_attributes_without_reason = "deny"

[package.metadata.pos]
layer = "app"
purpose = "The cloud's catalog with its fees: the item master, menus, taxonomies and layout and their compile, fee rules, media, tax rates, the translation grid, the item CSV import and export, and their routes and stores."
adrs = [43, 66, 74, 75, 159, 170, 175]
owners = ["@maintainers-cloud"]
