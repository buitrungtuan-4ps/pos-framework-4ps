[package]
name        = "pos-cloud-api"
version     = "0.0.0"
description = "What every cloud route needs: console and API-key authentication, the audit trail, paging and the error envelope."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
repository.workspace   = true

# Moved out of pos-cloud for the reporting pilot (ADR-0170 decision 4), with the same dependencies at
# the same versions: this crate adds edges to crates already in the lockfile, and nothing new. The
# reasons each is here are on pos-cloud's own lines for them.
[dependencies]
pos-ports = { path = "../pos-ports" }
pos-proto = { path = "../pos-proto" }
# The admin, API-key and audit tables (ADR-0016). This crate implements its own store traits for
# them, since a trait can be implemented for another crate's type only where the trait is defined.
store-postgres = { path = "../adapters/store-postgres" }

axum       = "0.8"
csv        = "1"
getrandom  = "0.4"
tokio      = { version = "1", features = ["sync", "time"] }
tracing    = "0.1"
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
utoipa     = "6"

# Super-admin auth (ADR-0034): argon2 for the password, HMAC-SHA1 for TOTP, SHA-256 for token hashes.
argon2 = "0.6"
hmac   = "0.13"
sha1   = "0.11"
sha2   = "0.11"

[dev-dependencies]
tokio     = { version = "1", features = ["rt-multi-thread", "macros"] }
pos-fakes = { path = "../pos-fakes" }

# The same lint table as pos-cloud, which this code came from.
[lints.rust]
unsafe_code                   = "deny"
missing_docs                  = "warn"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"
unused_qualifications         = "warn"

[lints.clippy]
all      = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

float_arithmetic    = "deny"
lossy_float_literal = "deny"
cast_precision_loss = "deny"

print_stdout = "deny"
print_stderr = "deny"
dbg_macro    = "deny"

allow_attributes                = "deny"
allow_attributes_without_reason = "deny"

[package.metadata.pos]
layer = "app"
purpose = "The base every cloud route module stands on: console sessions and permissions, API keys, the audit trail, paging and the error envelope."
adrs = [26, 34, 67, 68, 94, 95, 98, 170]
owners = ["@maintainers-cloud"]
