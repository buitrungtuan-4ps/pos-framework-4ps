[package]
name        = "pos-edge"
version     = "0.0.0"
description = "The store binary: serves the operator UI and wires adapters into pos-core."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
repository.workspace   = true

# The binary that everything else exists to run. Most of it is a library so the
# HTTP surface is testable without binding a socket (see tests/http.rs); main.rs
# is the thin entry point ADR-0013 calls the "load, decide, apply" layer.
[lib]
name = "pos_edge"

[[bin]]
name = "pos-edge"
path = "src/main.rs"

[features]
# By default the SolidJS build (ui/dist) is compiled into the binary, so the
# store is one static file (ADR-0018, ADR-0002). `dev-ui` flips rust-embed to
# read from disk, so a UI change is a browser refresh, not a Rust rebuild.
default = []
dev-ui  = []
# Country modules are selected per binary as a Cargo feature (ADR-0027): a fork
# serving one country enables one line and compiles nothing else. `country-zz`
# is the reference module; a real fork adds `country-vn = ["dep:pos-country-vn"]`
# and enables it in `default`. `cargo xtask countries` enforces that every wired
# country crate is selectable from a binary.
country-zz = ["dep:pos-country-zz"]

[dependencies]
# The backbone this binary composes. Paths, not versions: resolved by the workspace.
pos-core    = { path = "../pos-core" }
pos-ports   = { path = "../pos-ports" }
pos-proto   = { path = "../pos-proto" }
pos-country = { path = "../pos-country" }

# Country modules, selected per binary as features (ADR-0027). Optional, so a fork
# compiles only the ones it enables; `pos-country-zz` is the reference module.
pos-country-zz = { path = "../../countries/zz", optional = true }

# The real edge composes the SQLite event store (ADR-0015); main.rs opens it. The
# example composes pos-fakes instead.
store-sqlite = { path = "../adapters/store-sqlite" }

# The real edge composes its CloudSync channel (activation exchange, ADR-0054) and its OS-keyring
# KeyVault (the device credential + the scoped sync key, ADR-0086); serve() builds them only when a
# `cloud_url` is configured, so the on-fakes example never constructs them.
cloud-sync-http  = { path = "../adapters/cloud-sync-http" }
key-vault-keyring = { path = "../adapters/key-vault-keyring" }

# The `Signer` the OTA loop verifies an artifact with (ADR-0047, roadmap R5-d). A workspace path
# crate whose own subtree (ed25519-dalek, blake2) is already in the lock through the adapter's own
# test lane, so this adds no new third-party crate — and the adapter is verify-only: it cannot hold
# or generate a private key, which is what keeps signing keys off every store.
updater-minisign = { path = "../adapters/updater-minisign" }

# The store's outbound event stream (ADR-0087): the `MessageLink` half of the outbox, the
# same adapter whose consumer `pos_cloud` already runs. A workspace path crate — its
# `async-nats` subtree is already in the lock through the cloud, so this adds no new
# third-party dependency. Constructed only when a `[nats]` section and a server URL are
# both present, so the on-fakes example never touches it.
link-nats = { path = "../adapters/link-nats" }

# The async runtime and HTTP stack live at the binary layer only (ADR-0018). The
# dependency-rule test proves they never reach pos-core.
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum       = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["trace"] }
# `debug-embed` makes rust-embed embed in every profile, not only release, so the
# tests exercise the same serving path the shipped binary does. `dev-ui` reads
# from disk instead, and is handled explicitly in `http::assets`.
rust-embed = { version = "8", features = ["mime-guess", "debug-embed"] }

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Offline user authentication (ADR-0030): PIN verified against cloud-synced
# Argon2id hashes. Default features only ("password-hash"); salt generation is
# not needed at the edge, which only verifies.
argon2 = "0.5"

# The OS CSPRNG (ADR-0030), for the single-use pairing code and device tokens.
getrandom = "0.3"

# Hashes a device token before it is stored (ADR-0091): the registry keeps a
# SHA-256, never the token, so a stolen pos.db yields no working credential. Same
# RustCrypto line pos-cloud and blob-garage already pin (sha2 0.11), so this adds
# no new third-party crate to the lock. A plain digest and not a password KDF: the
# token is 128 bits from the OS CSPRNG, and this sits on the gate every request
# crosses.
sha2 = "0.11"

serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
toml       = "1"

# The edge's outbound cloud client (config-pull + heartbeat, ADR-0085): the same
# raw hyper/tokio-rustls stack the webhook sender (ADR-0038) and cloud-sync-http
# (ADR-0054) pin, and that pos-cloud + async-nats already put in the lock. These
# are direct-dependency lines, not a new subtree, so no new cargo-deny entry — the
# `ring` provider is pinned so feature unification cannot pull aws-lc-rs, and roots
# are the bundled webpki-roots Mozilla set, hermetic for a fork-and-deploy edge.
hyper          = { version = "1", features = ["client", "http1"] }
hyper-util     = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes          = "1"
tokio-rustls   = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots   = "1"
# `serde` so `EdgeConfig.cloud_url` (an `Option<Url>`) deserializes from the TOML string.
url            = { version = "2", features = ["serde"] }

[dev-dependencies]
# Exercise the router without a socket: build the Router and drive it with
# ServiceExt::oneshot.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
# The WebSocket fan-out test binds an ephemeral port and connects a real client.
# tokio-tungstenite is pinned to the version axum already resolves, so it adds no
# duplicate; no TLS features (the LAN socket is plaintext ws://).
tokio-tungstenite = "0.29"
futures-util = "0.3"
# The application layer runs against the in-memory fakes in tests, exactly as it will against
# store-sqlite in the field.
pos-fakes = { path = "../pos-fakes" }
# The shared port contract suites: `EdgeOrderIn` is proven against the `OrderIn` suite (ADR-0064),
# the same suite `FakeIntake` passes — so "the edge is a real OrderIn" is verified, not asserted.
pos-contract-tests = { path = "../pos-contract-tests" }
# The install seam works on real files, so its integration tests work on a real directory. Already in
# the lock as store-sqlite's dev-dependency at the same major, so `cargo deny`'s
# `multiple-versions = "deny"` stays satisfied.
tempfile = "3"

# A shipped binary, not a library, so it declares its own lint table rather than
# inheriting the strict library baseline (Cargo rejects a manifest that both
# inherits [workspace.lints] and adds to it). The money, no-PII-to-stdout, and
# no-float rules stay on; unwrap/expect/panic are left at their defaults so the
# startup path may use them where a failure is fatal anyway.
[lints.rust]
unsafe_code                   = "deny"
missing_docs                  = "warn"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"
unused_qualifications         = "warn"

[lints.clippy]
all      = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

float_arithmetic    = "deny"
lossy_float_literal = "deny"
cast_precision_loss = "deny"

print_stdout = "deny"
print_stderr = "deny"
dbg_macro    = "deny"

allow_attributes                = "deny"
allow_attributes_without_reason = "deny"
