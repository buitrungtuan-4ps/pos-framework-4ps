[package]
name        = "windows-protect"
version     = "0.1.0"
description = "Windows' own protection for a store box's state: DPAPI for the vault key, and who may read the state directory (ADR-0174)."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
repository.workspace   = true

# DPAPI, a directory's access-control list and this process's own account, and only on Windows. `windows-sys` 0.61 is already in
# the lock through `windows-service`, so this adds no crate to it (ADR-0174, Consequences).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[package.metadata.pos]
layer = "adapter"
purpose = "Windows' own protection for a store box's state: DPAPI for the vault key, and who may read the state directory."
adrs = [174]
owners = ["@maintainers-architecture"]
