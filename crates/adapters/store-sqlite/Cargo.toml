[package]
name        = "store-sqlite"
version     = "0.1.0"
description = "The edge EventStore and ConfigStore over SQLite (rusqlite, single-writer thread)."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
repository.workspace   = true

[dependencies]
pos-proto = { path = "../../pos-proto" }
pos-ports = { path = "../../pos-ports" }
serde_json.workspace = true
# ADR-0015: rusqlite bundled so the edge depends on no system SQLite on Windows or Linux.
rusqlite = { version = "0.40", features = ["bundled"] }
# ADR-0015: the async EventStore/ConfigStore surface bridged onto the blocking single-writer
# thread. Only `sync` in the production tree — the channel and oneshot, no runtime; `rt` is a
# dev-dependency for the contract suite's `block_on`.
tokio = { version = "1", default-features = false, features = ["sync"] }
# ADR-0131: the chain digest. SHA-256 on the RustCrypto line already pinned across this
# workspace (pos-cloud, pos-edge, blob-garage all on sha2 0.11), so no new crypto version
# enters the graph. `pos-proto` decides *what* is hashed and deliberately does not link
# this — see `pos_proto::chain` for why the backbone allow-list is left alone.
sha2 = "0.11"

[dev-dependencies]
pos-contract-tests = { path = "../../pos-contract-tests" }
pos-fakes = { path = "../../pos-fakes" }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
tempfile = "3"

[lints]
workspace = true
