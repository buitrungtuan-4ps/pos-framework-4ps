[package]
name        = "store-sqlite"
version     = "0.1.0"
description = "The edge EventStore and ConfigStore over SQLite (rusqlite, single-writer thread)."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
repository.workspace   = true

[dependencies]
pos-proto = { path = "../../pos-proto" }
pos-ports = { path = "../../pos-ports" }
serde_json.workspace = true
# ADR-0015: rusqlite bundled so the edge depends on no system SQLite on Windows or Linux.
rusqlite = { version = "0.40", features = ["bundled"] }
# ADR-0015: the async EventStore/ConfigStore surface bridged onto the blocking single-writer
# thread. Only `sync` in the production tree — the channel and oneshot, no runtime; `rt` is a
# dev-dependency for the contract suite's `block_on`.
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
pos-contract-tests = { path = "../../pos-contract-tests" }
pos-fakes = { path = "../../pos-fakes" }
tokio = { version = "1", default-features = false, features = ["rt"] }
tempfile = "3"

[lints]
workspace = true
