[package]
name        = "link-nats"
version     = "0.1.0"
description = "The store to cloud MessageLink over NATS JetStream, and the cloud to store config wake (async-nats)."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
repository.workspace   = true

[features]
# The tests that need a live NATS server with JetStream are gated here, so the pull-request `test`
# job neither compiles nor runs them. The merge-to-`main` integration job and a developer with
# NATS_URL set enable it: `cargo test -p link-nats --features integration`.
integration = []

[dependencies]
pos-proto = { path = "../../pos-proto" }
pos-ports = { path = "../../pos-ports" }
serde_json.workspace = true
# ADR-0031: the JetStream client protocol (framing, publish acks, flow control, stream management,
# reconnection) is the "genuinely hard and general" infrastructure ADR-0007 says to buy, and the link
# is load-bearing — every sale eventually travels it — so this is the one adapter that carries a real
# client dependency.
async-nats = "0.51"
# The consumer iterates a JetStream batch, which async-nats delivers as a `Stream`; `StreamExt::next`
# drives it. Already in the tree via the async stack; no new version.
futures-util = "0.3"
# Reading credentials out of a NATS URL, which async-nats parses but never presents (see
# src/endpoint.rs). Neither crate is new to the tree: `url` is already a direct dependency of five
# crates and both are already compiled here as transitives of async-nats itself, so this adds a
# dependency *edge*, not a dependency.
url = "2"
percent-encoding = "2"
# ADR-0195: the store's wake waits at most `within` and notices a reconnect while it waits (the
# `StoreWake` contract, obligations 1 and 4, which belong to the adapter), and async-nats offers no
# timer of its own. Not a new crate: async-nats is built on tokio, tokio is already this crate's
# dev-dependency, and five adapters depend on it directly, so this adds a dependency *edge*, with
# only the `time` feature.
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
pos-contract-tests = { path = "../../pos-contract-tests" }
# The contract suite supplies its own block_on; async-nats needs a multi-thread runtime with IO.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

[package.metadata.pos]
layer = "adapter"
purpose = "The store-to-cloud MessageLink over NATS JetStream, the cloud's consumer of it, and the cloud-to-store config wake."
adrs = [24, 26, 31, 87, 195]
owners = ["@maintainers-cloud"]
