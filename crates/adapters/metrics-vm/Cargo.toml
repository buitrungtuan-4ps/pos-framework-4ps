[package]
name        = "metrics-vm"
version     = "0.1.0"
description = "The cloud MetricsSink over VictoriaMetrics (bounded queue, background flush, hand-rolled HTTP import)."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
repository.workspace   = true

[dependencies]
pos-proto = { path = "../../pos-proto" }
pos-ports = { path = "../../pos-ports" }
serde_json.workspace = true
# ADR-0031: telemetry is off the sales path, sparse by design, and one HTTP endpoint — so the
# transport is hand-rolled over tokio rather than carrying an HTTP client crate. `net`/`io-util` for
# the socket, `sync` for the bounded queue, `rt`/`macros` for the background flush task.
tokio = { version = "1", features = ["rt", "sync", "net", "io-util", "time", "macros"] }

[dev-dependencies]
pos-contract-tests = { path = "../../pos-contract-tests" }
# The contract suite supplies its own block_on; the tests need a multi-thread runtime with IO for
# the in-process HTTP mock that pins the VictoriaMetrics import wire format.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[lints]
workspace = true
