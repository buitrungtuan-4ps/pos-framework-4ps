[package]
name        = "pos-render"
version     = "0.1.0"
description = "Turns a line of text in any script into the 1-bit raster a thermal printer prints."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
repository.workspace   = true

[dependencies]
pos-ports = { path = "../pos-ports" }
# Shaping. The HarfBuzz project's own Rust port: it reorders Devanagari matras, forms Khmer and
# Indic conjuncts, and applies the OpenType features Vietnamese tone marks need. No C toolchain,
# which is what keeps the edge cross-compiling to Windows and ARM (ADR-0102).
#
# `harfrust` rather than `rustybuzz`, and `skrifa` rather than `ttf-parser`, because RUSTSEC-2026-0206
# and RUSTSEC-2026-0192 declared both of those unmaintained. These two are the successors their own
# advisories name, they are actively maintained (HarfBuzz and Google Fonts' fontations), and they
# share one font parser — `read-fonts` — so the tree gains no second one.
harfrust = { version = "0.14.0", default-features = false, features = ["std"] }
# Outlines, over the same `read-fonts` parser harfrust uses. These two versions are coupled and are
# bumped together or not at all: each depends on read-fonts at a `0.x` minor of its own, so a skrifa
# a minor ahead of harfrust (or behind it) puts a second read-fonts in the tree, which `deny.toml`'s
# `multiple-versions = "deny"` refuses. harfrust 0.14 and skrifa 0.48 both ask for `^0.45.0`.
# `.github/dependabot.yml` groups the two so a bump of one is proposed with the other; when a skrifa
# needs a read-fonts no harfrust has been released against, wait for that harfrust rather than
# pinning around it.
skrifa = { version = "0.48.0", default-features = false, features = ["std"] }

[lints]
workspace = true

[package.metadata.pos]
layer = "app"
purpose = "Turns a line of text in any script into the 1-bit raster a thermal printer prints."
adrs = [102]
owners = ["@maintainers-architecture"]
