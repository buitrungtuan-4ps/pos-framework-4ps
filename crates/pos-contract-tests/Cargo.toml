[package]
name        = "pos-contract-tests"
version     = "0.1.0"
description = "The shared suites every implementation of every port must pass."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
repository.workspace   = true

[dependencies]
pos-ports = { path = "../pos-ports" }
pos-proto = { path = "../pos-proto" }
serde.workspace      = true
serde_json.workspace = true

# NOTE: no async runtime here, and that is deliberate (ADR-0026 §6). Each adapter
# supplies its own `block_on` when it invokes a suite macro, so this crate never
# chooses tokio on an adapter's behalf and pos-fakes can run every suite with a
# twenty-line poller instead.

[lints]
workspace = true
