[package]
name        = "pos-cloud-devices"
version     = "0.0.0"
description = "The cloud's devices: activation codes, claiming an unclaimed box, device onboarding, and their routes and stores."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
repository.workspace   = true

# Moved out of pos-cloud (ADR-0170 decision 4, P7), with the same dependencies at the same versions:
# this crate adds edges to crates already in the lockfile, and nothing new.
[dependencies]
pos-cloud-api    = { path = "../pos-cloud-api" }
pos-cloud-config = { path = "../pos-cloud-config" }
pos-core         = { path = "../pos-core" }
# `openapi`: the wire types this crate's records carry need their schemas (ADR-0177, ADR-0180).
pos-proto        = { path = "../pos-proto", features = ["openapi"] }
# The claim, activation-code and device-proposal tables (ADR-0016). This crate implements its store
# traits for them, since a trait can be implemented for another crate's type only where the trait is
# defined.
store-postgres = { path = "../adapters/store-postgres" }

axum       = "0.8"
# A claim's user code and an activation code are minted from OS entropy and stored as SHA-256
# hashes, as they were in pos-cloud.
getrandom  = "0.4"
sha2       = "0.11"
tracing    = "0.1"
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
utoipa     = "6"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# The same lint table as pos-cloud, which this code came from.
[lints.rust]
unsafe_code                   = "deny"
missing_docs                  = "warn"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"
unused_qualifications         = "warn"

[lints.clippy]
all      = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

float_arithmetic    = "deny"
lossy_float_literal = "deny"
cast_precision_loss = "deny"

print_stdout = "deny"
print_stderr = "deny"
dbg_macro    = "deny"

allow_attributes                = "deny"
allow_attributes_without_reason = "deny"

[package.metadata.pos]
layer = "app"
purpose = "The cloud's devices: the activation-code exchange, claiming an unclaimed box, device onboarding, the store's devices node and its deny-list, and their routes and stores."
adrs = [41, 50, 118, 148, 170]
owners = ["@maintainers-cloud"]
