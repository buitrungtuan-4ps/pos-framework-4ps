[package]
name        = "pos-cloud-people"
version     = "0.0.0"
description = "The cloud's people and access: employees, role templates and assignments, their compile to a store's permissions and their publish, and their routes and stores."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
repository.workspace   = true

# Moved out of pos-cloud (ADR-0170 decision 4, ADR-0175), with the same dependencies at the same
# versions: this crate adds edges to crates already in the lockfile, and nothing new.
[dependencies]
pos-cloud-api     = { path = "../pos-cloud-api" }
# The employee list pages like the item list, and refuses page shaping the same way.
pos-cloud-catalog = { path = "../pos-cloud-catalog" }
pos-cloud-config  = { path = "../pos-cloud-config" }
pos-core          = { path = "../pos-core" }
pos-ports         = { path = "../pos-ports" }
pos-proto         = { path = "../pos-proto" }
# The employee, role-template, assignment and republish-queue tables (ADR-0016). This crate
# implements its store traits for them, since a trait can be implemented for another crate's type
# only where the trait is defined.
store-postgres = { path = "../adapters/store-postgres" }

tokio      = { version = "1", features = ["macros", "time"] }
axum       = "0.8"
tracing    = "0.1"
# An employee and an assignment id are minted from OS entropy, as they were in pos-cloud.
getrandom  = "0.4"
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
utoipa     = "6"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# The same lint table as pos-cloud, which this code came from.
[lints.rust]
unsafe_code                   = "deny"
missing_docs                  = "warn"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"
unused_qualifications         = "warn"

[lints.clippy]
all      = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

float_arithmetic    = "deny"
lossy_float_literal = "deny"
cast_precision_loss = "deny"

print_stdout = "deny"
print_stderr = "deny"
dbg_macro    = "deny"

allow_attributes                = "deny"
allow_attributes_without_reason = "deny"

[package.metadata.pos]
layer = "app"
purpose = "The cloud's people and access: employees, role templates and assignments, their compile to a store's permissions node, its publish and republish queue, the capability flags, and their routes and stores."
adrs = [70, 71, 158, 170, 175]
owners = ["@maintainers-cloud"]
