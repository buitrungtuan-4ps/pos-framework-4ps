[package]
name        = "pos-edge-app"
version     = "0.0.0"
description = "The store's application layer: Edge and its commands, sign-in, and the authorities, clocks and status they keep."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
repository.workspace   = true

[features]
# The PIN hasher a demo store needs and a real one never does (`auth::hash_pin`). pos-edge forwards
# its own `demo-fixtures` feature here; off by default, so a shipped store compiles none of it.
demo-fixtures = []

# Moved out of pos-edge (ADR-0170 decision 4, P7), with the same dependencies at the same versions:
# this crate adds edges to crates already in the lockfile, and nothing new.
[dependencies]
pos-core  = { path = "../pos-core" }
pos-ports = { path = "../pos-ports" }
pos-proto = { path = "../pos-proto" }
# The lease, queue-number and receipt-number authorities are implemented for the SQLite event store
# here, since a trait can be implemented for another crate's type only where the trait is defined.
store-sqlite = { path = "../adapters/store-sqlite" }

tokio      = { version = "1", features = ["rt", "net", "sync", "time"] }
tracing    = "0.1"
# Offline user authentication (ADR-0030): a PIN is verified against cloud-synced Argon2id hashes.
argon2     = "0.6"
# The OS CSPRNG, for the id generator's seed, the fan-out's stream id and the SNTP nonce.
getrandom  = "0.4"
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# The application layer runs against the in-memory fakes in tests, exactly as it does against
# store-sqlite in the field.
pos-fakes = { path = "../pos-fakes" }

# The same lint table as pos-edge, which this code came from.
[lints.rust]
unsafe_code                   = "deny"
missing_docs                  = "warn"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"
unused_qualifications         = "warn"

[lints.clippy]
all      = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

float_arithmetic    = "deny"
lossy_float_literal = "deny"
cast_precision_loss = "deny"

print_stdout = "deny"
print_stderr = "deny"
dbg_macro    = "deny"

allow_attributes                = "deny"
allow_attributes_without_reason = "deny"

[package.metadata.pos]
layer = "app"
purpose = "The store's application layer: Edge and every command it loads, decides, applies and publishes, with sign-in, the fan-out, and the authorities, clocks and status it keeps."
adrs = [13, 18, 30, 91, 170]
owners = ["@maintainers-architecture"]
