# Throwaway spike (overhaul GĐ0): CEL on the edge and in the browser. Never merged.
[package]
name = "cel-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
