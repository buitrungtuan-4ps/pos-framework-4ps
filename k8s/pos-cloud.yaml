# Kubernetes lane for a pos_cloud country cell — the OPTIONAL mirror of deploy/compose.yml
# (ADR-0044). A starting skeleton, not a turnkey chart: adapt every `# ADAPT` line to your cluster.
# Secrets (pos-cloud-config, postgres-credentials, nats-config, garage-config) are created out of
# band with kubectl, never committed — see k8s/README.md. Backends use a Deployment + PVC with the
# Recreate strategy (single instance, one RWO volume); `args:` overrides only CMD so each image's
# entrypoint/init still runs.
---
apiVersion: v1
kind: Namespace
metadata:
  name: pos-cloud
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: pos-cloud
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard # ADAPT to your cluster's storage class
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wal-archive
  namespace: pos-cloud
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard # ADAPT
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pos-cloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.4-bookworm
          # args (not command): keep docker-entrypoint.sh so the database still initialises. WAL
          # archiving as in compose.yml (ADR-0046); a CronJob ships /wal-archive off-box.
          args:
            - postgres
            - -c
            - archive_mode=on
            - -c
            - wal_level=replica
            - -c
            - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
            - -c
            - max_wal_size=1GB
          envFrom:
            - secretRef:
                name: postgres-credentials
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: wal-archive
              mountPath: /wal-archive
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata
        - name: wal-archive
          persistentVolumeClaim:
            claimName: wal-archive
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pos-cloud
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-data
  namespace: pos-cloud
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard # ADAPT
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: pos-cloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10.20-alpine
          args: ["-c", "/etc/nats/nats.conf"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          volumeMounts:
            - name: nats-config
              mountPath: /etc/nats
              readOnly: true
            - name: nats-data
              mountPath: /data
      volumes:
        - name: nats-config
          secret:
            secretName: nats-config
        - name: nats-data
          persistentVolumeClaim:
            claimName: nats-data
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: pos-cloud
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-meta
  namespace: pos-cloud
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard # ADAPT
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  namespace: pos-cloud
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard # ADAPT
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  namespace: pos-cloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v1.0.1
          args: ["server"]
          ports:
            - containerPort: 3900
            - containerPort: 3901
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          volumeMounts:
            - name: garage-config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: garage-meta
              mountPath: /var/lib/garage/meta
            - name: garage-data
              mountPath: /var/lib/garage/data
      volumes:
        - name: garage-config
          secret:
            secretName: garage-config
        - name: garage-meta
          persistentVolumeClaim:
            claimName: garage-meta
        - name: garage-data
          persistentVolumeClaim:
            claimName: garage-data
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: pos-cloud
spec:
  selector:
    app: garage
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
    - name: rpc
      port: 3901
      targetPort: 3901
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pos-cloud
  namespace: pos-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pos-cloud
  template:
    metadata:
      labels:
        app: pos-cloud
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: pos-cloud
          image: ghcr.io/your-org/pos-cloud:latest # ADAPT to your built image (an immutable tag)
          env:
            - name: POS_CLOUD_CONFIG
              value: /etc/pos-cloud/cloud.toml
            - name: RUST_LOG
              value: info
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: pos-cloud-config
              mountPath: /etc/pos-cloud
              readOnly: true
      volumes:
        - name: pos-cloud-config
          secret:
            secretName: pos-cloud-config
---
apiVersion: v1
kind: Service
metadata:
  name: pos-cloud
  namespace: pos-cloud
spec:
  selector:
    app: pos-cloud
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pos-cloud
  namespace: pos-cloud
  annotations:
    # ADAPT: issue over DNS-01 (Cloudflare), grey-clouded record, never Flexible SSL (ADR-0023).
    cert-manager.io/cluster-issuer: letsencrypt-dns01 # ADAPT to your cert-manager issuer
    # `/internal/*` is the cloud's own trusted-network surface and is NOT part of the public one.
    # Those handlers authenticate nothing — deliberately, because they are documented as
    # private-network-only (`/internal/ingest` is the reconciliation re-push, `/internal/reconcile`
    # the id-diff endpoint, `/internal/ota/report` the fleet report). The Compose lane closes them in
    # deploy/Caddyfile.d/site.caddy; this lane published them, unauthenticated, to the internet —
    # event injection, an id-holding oracle, and falsifiable fleet state for any tenant.
    #
    # 404, not 403: a 403 confirms the route exists, and an internal surface should tell an
    # unauthenticated caller nothing at all. `^~` beats the prefix location the `/` rule generates,
    # so this cannot be reordered behind the proxy by a later edit.
    #
    # An allow-list of public prefixes would be fail-closed and need no annotation, but it is not
    # available here: the console is a single-page app served from the `/` catch-all
    # (crates/pos-cloud/src/main.rs `service.fallback(assets::serve)`), so every client-routed path
    # must reach the backend. Denying the one private prefix is the only shape that works, and it is
    # the same shape the Compose lane uses.
    #
    # ADAPT — and then VERIFY, because this annotation is silently ignored when the cluster runs
    # ingress-nginx with `allow-snippet-annotations: false` (its default since 1.9). After applying,
    # confirm the deny actually took effect:
    #
    #     curl -s -o /dev/null -w '%{http_code}\n' https://cloud.example.com/internal/reconcile
    #
    # It must print 404. If it does not, your controller is ignoring this and you must implement the
    # deny another way — a front proxy, a controller-native route rule, or a middleware CRD (Traefik:
    # a `Middleware` with `replacePathRegex`/`errors`; HAProxy: `http-request deny`). Do not run this
    # lane in production until that curl prints 404. See k8s/README.md.
    nginx.ingress.kubernetes.io/server-snippet: |
      location ^~ /internal/ {
        return 404;
      }
spec:
  ingressClassName: nginx # ADAPT to your ingress controller
  tls:
    - hosts:
        - cloud.example.com # ADAPT to your DOMAIN
      secretName: pos-cloud-tls
  rules:
    - host: cloud.example.com # ADAPT to your DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pos-cloud
                port:
                  number: 8080
