# Sealed secrets for a Linux store box (ADR-0151): installed beside pos-edge.service, as
# /etc/systemd/system/pos-edge.service.d/vault.conf, once `pos-edge-vault seal` has sealed a vault
# key. Without this file the edge keeps its device credential in the kernel keyring, which a reboot
# empties. The copies the installers carry must match this file (installer-syntax.mjs).
[Service]
# "+" runs the helper as root, because systemd-creds is root-only; the service itself stays `pos`.
# "-" lets the edge start if the key does not unseal: its vault then answers errors, so the counter
# keeps trading and cloud sync waits, and the log says to run the installer again.
ExecStartPre=-+/usr/local/libexec/pos-edge/pos-edge-vault unseal
Environment=POS_EDGE_VAULT_KEY=/run/pos-edge-vault/vault-key
Environment=POS_EDGE_VAULT_DIR=/var/lib/pos-edge/vault
