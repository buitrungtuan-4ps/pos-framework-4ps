# Pinned so a build today and a build in three years produce the same result
# (engineering-guide.md §5). The MSRV in Cargo.toml equals this pin: we build
# with exactly one toolchain, and claiming compatibility with an older compiler
# that CI never exercises would be a promise nothing tests. Raising the pin is
# therefore a minor-version change, per the MSRV policy.
[toolchain]
channel    = "1.94.1"
components = ["rustfmt", "clippy"]
targets    = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
profile    = "minimal"
