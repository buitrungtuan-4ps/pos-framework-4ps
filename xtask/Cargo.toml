[package]
name        = "xtask"
version     = "0.0.0"
description = "Repository checks: the dependency rule, naming, snapshots, docs gates."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "1"

# xtask is a developer tool, not a shipped artifact, so it declares its own lint
# table rather than inheriting the strict library baseline. Inheriting and adding
# is not possible — Cargo rejects a manifest that does both.
[lints.rust]
missing_docs = "warn"
unsafe_code  = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
